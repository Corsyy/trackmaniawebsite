<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trackmania Events — Chat Admin</title>
  <meta name="theme-color" content="#0a0f1a" />
  <style>
    :root{
      --bg:#0a0f1a; --panel:#0f1524; --panel2:#101a30;
      --text:#e6ecff; --muted:#9bb0ff;
      --accent:#3aa0ff; --accent2:#6dfbff;
      --border:rgba(109,251,255,.22);
      --good:#2ee59d; --warn:#ffcf5a;
      --bad:#ff5a7a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg, rgba(15,21,36,.95), rgba(15,21,36,.70));backdrop-filter: blur(6px);border-bottom:1px solid var(--border)}
    .head{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{font-weight:900;letter-spacing:.3px}
    .wrap{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:14px}
    .card{border:1px solid var(--border);background:rgba(15,21,36,.65);border-radius:16px;overflow:hidden}
    .card h2{margin:0;padding:12px 14px;font-size:14px;color:var(--muted);border-bottom:1px solid rgba(109,251,255,.12)}
    .pane{padding:12px 14px}
    .row{display:flex;gap:10px;align-items:center}
    input,button,textarea{
      font:inherit;color:var(--text);background:rgba(16,26,48,.75);
      border:1px solid rgba(109,251,255,.18);border-radius:12px;padding:10px 12px;outline:none
    }
    input:focus,textarea:focus{border-color:rgba(109,251,255,.45)}
    button{
      cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#001220;font-weight:900;border:none
    }
    button.secondary{background:rgba(16,26,48,.75);color:var(--text);border:1px solid rgba(109,251,255,.18)}
    button.danger{background:linear-gradient(135deg,#ff5a7a,#ffcf5a);color:#1a0b10}
    .muted{color:var(--muted);font-size:12px}
    .list{display:flex;flex-direction:column;gap:10px}
    .item{
      padding:10px 12px;border-radius:14px;border:1px solid rgba(109,251,255,.14);
      background:rgba(16,26,48,.55);cursor:pointer
    }
    .item:hover{border-color:rgba(109,251,255,.35)}
    .itemTop{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .sid{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;color:var(--muted)}
    .preview{margin-top:6px;font-size:13px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pill{
      font-size:11px;font-weight:900;letter-spacing:.2px;padding:4px 8px;border-radius:999px;
      border:1px solid rgba(109,251,255,.22)
    }
    .pill.open{background:rgba(46,229,157,.12);border-color:rgba(46,229,157,.35);color:var(--good)}
    .pill.closed{background:rgba(255,90,122,.10);border-color:rgba(255,90,122,.35);color:var(--bad)}
    .chatBox{height:520px;overflow:auto;padding:12px 14px;background:rgba(10,15,26,.35)}
    .msg{max-width:78%;padding:10px 12px;border-radius:14px;margin:8px 0;border:1px solid rgba(109,251,255,.16)}
    .msg .meta{font-size:11px;color:var(--muted);margin-bottom:6px}
    .msg.visitor{margin-right:auto;background:rgba(16,26,48,.70)}
    .msg.admin{margin-left:auto;background:rgba(58,160,255,.18);border-color:rgba(58,160,255,.35)}
    .msg.system{margin-left:auto;margin-right:auto;max-width:92%;background:rgba(255,207,90,.10);border-color:rgba(255,207,90,.25)}
    .compose{display:flex;gap:10px;padding:12px 14px;border-top:1px solid rgba(109,251,255,.12);background:rgba(15,21,36,.65)}
    .compose input{flex:1}
    .topActions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
    .rightActions{display:flex;gap:10px;align-items:center}
    .notice{padding:10px 12px;border-radius:14px;border:1px solid rgba(109,251,255,.18);background:rgba(16,26,48,.55);margin-bottom:10px}
  </style>
</head>
<body>
<header>
  <div class="head">
    <div class="brand">Trackmania Events — Chat Admin</div>
    <div class="row">
      <button class="secondary" id="btnRefresh">Refresh</button>
      <button class="secondary" id="btnLogout">Logout</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Login</h2>
    <div class="pane">
      <div class="notice muted">
        Open this admin panel from the chat service host (this page). Cookie auth requires <b>credentials: include</b>.
      </div>
      <div class="row">
        <input id="password" type="password" placeholder="Admin password" style="flex:1" />
        <button id="btnLogin">Login</button>
      </div>
      <div id="loginStatus" class="muted" style="margin-top:10px"></div>
    </div>
  </div>

  <div class="card">
    <h2>Conversations</h2>
    <div class="pane">
      <div id="convList" class="list"></div>
      <div id="convEmpty" class="muted" style="display:none;margin-top:10px">No conversations yet.</div>
    </div>
  </div>

  <div class="card" style="grid-column: 1 / span 2;">
    <h2>
      Active Conversation
      <span id="activeMeta" class="muted"></span>
    </h2>
    <div class="topActions pane">
      <div class="row" style="gap:12px">
        <div id="activeSid" class="sid">No conversation selected</div>
        <div id="activePill" class="pill" style="display:none"></div>
      </div>
      <div class="rightActions">
        <button id="btnEndChat" class="danger" disabled>End chat</button>
      </div>
    </div>

    <div id="chatBox" class="chatBox"></div>

    <div class="compose">
      <input id="replyText" placeholder="Type a reply…" disabled />
      <button id="btnSend" disabled>Send</button>
    </div>
  </div>
</div>

<script>
  // Admin runs on same origin as API
  const API_BASE = "";

  const el = (id) => document.getElementById(id);

  const state = {
    authed: false,
    activeSid: null,
    activeStatus: null,
    pollTimer: null,
    lastTs: 0,
  };

  function fmtTime(ts){
    try { return new Date(ts).toLocaleString(); } catch { return String(ts); }
  }

  function pill(status){
    const p = el("activePill");
    p.style.display = "inline-block";
    p.className = "pill " + (status === "open" ? "open" : "closed");
    p.textContent = status === "open" ? "OPEN" : "CLOSED";
  }

  function setLoginStatus(msg){
    el("loginStatus").textContent = msg || "";
  }

  async function api(path, opts = {}){
    const res = await fetch(API_BASE + path, {
      ...opts,
      headers: { "Content-Type": "application/json", ...(opts.headers || {}) },
      credentials: "include",
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function login(){
    setLoginStatus("Logging in…");
    const password = el("password").value;
    const r = await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({ password })
    });
    if (!r.ok){
      state.authed = false;
      setLoginStatus(r.data?.error || "Login failed");
      return;
    }
    state.authed = true;
    setLoginStatus("Logged in.");
    await loadConversations();
  }

  async function logout(){
    await api("/api/admin/logout", { method:"POST", body:"{}" });
    state.authed = false;
    state.activeSid = null;
    state.activeStatus = null;
    el("convList").innerHTML = "";
    el("chatBox").innerHTML = "";
    el("activeSid").textContent = "No conversation selected";
    el("activePill").style.display = "none";
    el("btnEndChat").disabled = true;
    el("btnSend").disabled = true;
    el("replyText").disabled = true;
    setLoginStatus("Logged out.");
    stopPolling();
  }

  async function loadConversations(){
    if (!state.authed) return;
    const r = await api("/api/admin/conversations");
    if (!r.ok){
      setLoginStatus(r.data?.error || "Failed to load conversations");
      if (r.status === 401) state.authed = false;
      return;
    }

    const list = r.data.conversations || [];
    const container = el("convList");
    container.innerHTML = "";

    el("convEmpty").style.display = list.length ? "none" : "block";

    for (const c of list){
      const div = document.createElement("div");
      div.className = "item";
      div.innerHTML = `
        <div class="itemTop">
          <div class="sid">${c.sid}</div>
          <div class="pill ${c.status === "open" ? "open" : "closed"}">${c.status === "open" ? "OPEN" : "CLOSED"}</div>
        </div>
        <div class="preview">${(c.lastTextPreview || "").replace(/</g,"&lt;")}</div>
        <div class="muted" style="margin-top:6px">
          Updated: ${fmtTime(c.updatedAt)} • Messages: ${c.messageCount}
        </div>
      `;
      div.addEventListener("click", () => selectConversation(c.sid));
      container.appendChild(div);
    }
  }

  function renderMessages(msgs){
    const box = el("chatBox");
    box.innerHTML = "";
    for (const m of msgs){
      const div = document.createElement("div");
      div.className = "msg " + m.from;
      div.innerHTML = `
        <div class="meta">${m.from.toUpperCase()} • ${fmtTime(m.ts)}</div>
        <div>${String(m.text).replace(/</g,"&lt;")}</div>
      `;
      box.appendChild(div);
      state.lastTs = Math.max(state.lastTs, Number(m.ts || 0));
    }
    box.scrollTop = box.scrollHeight;
  }

  function appendMessages(msgs){
    const box = el("chatBox");
    let stickToBottom = (box.scrollTop + box.clientHeight) >= (box.scrollHeight - 40);

    for (const m of msgs){
      const div = document.createElement("div");
      div.className = "msg " + m.from;
      div.innerHTML = `
        <div class="meta">${m.from.toUpperCase()} • ${fmtTime(m.ts)}</div>
        <div>${String(m.text).replace(/</g,"&lt;")}</div>
      `;
      box.appendChild(div);
      state.lastTs = Math.max(state.lastTs, Number(m.ts || 0));
    }

    if (stickToBottom) box.scrollTop = box.scrollHeight;
  }

  async function selectConversation(sid){
    if (!state.authed) return;

    state.activeSid = sid;
    state.lastTs = 0;

    el("activeSid").textContent = sid;
    el("activeMeta").textContent = "";

    const r = await api("/api/admin/conversation?sid=" + encodeURIComponent(sid));
    if (!r.ok){
      setLoginStatus(r.data?.error || "Failed to load conversation");
      return;
    }

    state.activeStatus = r.data.status;
    pill(state.activeStatus);

    const statusOpen = state.activeStatus === "open";
    el("btnEndChat").disabled = !statusOpen;
    el("btnSend").disabled = !statusOpen;
    el("replyText").disabled = !statusOpen;

    renderMessages(r.data.messages || []);
    startPolling();
  }

  async function sendReply(){
    if (!state.authed || !state.activeSid) return;
    const text = el("replyText").value.trim();
    if (!text) return;

    const r = await api("/api/admin/send", {
      method: "POST",
      body: JSON.stringify({ sid: state.activeSid, text })
    });

    if (!r.ok){
      setLoginStatus(r.data?.error || "Send failed");
      if (r.status === 409){
        state.activeStatus = "closed";
        pill("closed");
        el("btnEndChat").disabled = true;
        el("btnSend").disabled = true;
        el("replyText").disabled = true;
      }
      return;
    }

    el("replyText").value = "";
    // Poll will pick it up quickly; do a fast refresh
    await pollActiveOnce();
  }

  async function endChat(){
    if (!state.authed || !state.activeSid) return;

    const r = await api("/api/admin/close", {
      method: "POST",
      body: JSON.stringify({ sid: state.activeSid })
    });

    if (!r.ok){
      setLoginStatus(r.data?.error || "Close failed");
      return;
    }

    state.activeStatus = "closed";
    pill("closed");
    el("btnEndChat").disabled = true;
    el("btnSend").disabled = true;
    el("replyText").disabled = true;

    await pollActiveOnce();
    await loadConversations();
  }

  function startPolling(){
    stopPolling();
    state.pollTimer = setInterval(pollActiveOnce, 1500);
  }

  function stopPolling(){
    if (state.pollTimer){
      clearInterval(state.pollTimer);
      state.pollTimer = null;
    }
  }

  async function pollActiveOnce(){
    if (!state.authed || !state.activeSid) return;

    const r = await api("/api/admin/conversation?sid=" + encodeURIComponent(state.activeSid));
    if (!r.ok){
      // conversation may have been purged/restarted; just stop polling
      stopPolling();
      return;
    }

    // Update status + controls live
    state.activeStatus = r.data.status;
    pill(state.activeStatus);

    const statusOpen = state.activeStatus === "open";
    el("btnEndChat").disabled = !statusOpen;
    el("btnSend").disabled = !statusOpen;
    el("replyText").disabled = !statusOpen;

    // Efficient append: only add newer messages
    const msgs = r.data.messages || [];
    const newer = msgs.filter(m => Number(m.ts || 0) > state.lastTs);
    if (newer.length) appendMessages(newer);
  }

  // bindings
  el("btnLogin").addEventListener("click", login);
  el("password").addEventListener("keydown", (e) => { if (e.key === "Enter") login(); });

  el("btnLogout").addEventListener("click", logout);
  el("btnRefresh").addEventListener("click", async () => {
    await loadConversations();
    if (state.activeSid) await pollActiveOnce();
  });

  el("btnSend").addEventListener("click", sendReply);
  el("replyText").addEventListener("keydown", (e) => { if (e.key === "Enter") sendReply(); });

  el("btnEndChat").addEventListener("click", endChat);

  // initial load (if already authed, this will succeed; otherwise shows error silently)
  (async () => {
    const r = await api("/api/admin/conversations");
    if (r.ok){
      state.authed = true;
      setLoginStatus("Logged in.");
      await loadConversations();
    } else {
      state.authed = false;
      setLoginStatus("Not logged in.");
    }
  })();
</script>
</body>
</html>
