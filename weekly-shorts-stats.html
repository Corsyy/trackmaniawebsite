<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Weekly Shorts Stats</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:0;background:#0b0d10;color:#e9eef7}
    header{padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center;justify-content:space-between}
    h1{font-size:18px;margin:0}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 20px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    select,input{background:#121722;border:1px solid rgba(255,255,255,.14);color:#e9eef7;border-radius:10px;padding:9px 10px}
    .card{background:#0f141d;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:14px;margin-top:14px}
    .muted{color:rgba(233,238,247,.68)}
    table{width:100%;border-collapse:collapse}
    th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;font-size:14px}
    th{color:rgba(233,238,247,.78);font-weight:600}
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.10);font-size:12px}
    .error{color:#ff9aa2}
    .ok{color:#9dffb0}
    a{color:#9ad5ff}
  </style>
</head>
<body>
<header>
  <h1>Weekly Shorts Stats</h1>
  <div class="row">
    <span class="muted" id="status">Loading…</span>
  </div>
</header>

<div class="wrap">

  <div class="row">
    <label class="muted">Week:</label>
    <select id="weekSel"></select>

    <label class="muted">Search player:</label>
    <input id="search" placeholder="type to filter (aggregate)" />
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="muted">Selected week</div>
        <div id="weekTitle" style="font-size:16px;font-weight:700;margin-top:2px">—</div>
        <div class="muted" id="weekMeta" style="margin-top:4px">—</div>
      </div>
      <div class="muted" id="weekGenerated">—</div>
    </div>

    <div style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th style="width:70px">Rank</th>
            <th>Player</th>
            <th style="width:140px">Time</th>
            <th style="width:80px">WR</th>
          </tr>
        </thead>
        <tbody id="weekBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="muted">Aggregate</div>
        <div class="muted" style="margin-top:4px">wins / wrs / top5</div>
      </div>
      <div class="muted" id="aggGenerated">—</div>
    </div>

    <div style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th>Player</th>
            <th style="width:90px">Wins</th>
            <th style="width:90px">WRs</th>
            <th style="width:90px">Top5</th>
          </tr>
        </thead>
        <tbody id="aggBody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div>
        <div class="muted">Changelog</div>
        <div class="muted" style="margin-top:4px">WR improvements after week ended</div>
      </div>
    </div>

    <div style="margin-top:12px">
      <table>
        <thead>
          <tr>
            <th style="width:180px">When</th>
            <th style="width:90px">Week</th>
            <th>Change</th>
          </tr>
        </thead>
        <tbody id="chgBody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_BASE = "https://trackmaniawebsite.onrender.com";
  const PATHS = {
    weeksIndex: `${API_BASE}/api/weekly-shorts/weeks`,
    aggregate:  `${API_BASE}/api/weekly-shorts/aggregate`,
    changelog:  `${API_BASE}/api/weekly-shorts/changelog`,
    weekFile:   (weekNum) => `${API_BASE}/api/weekly-shorts/week/${weekNum}`
  };

  const $ = (id) => document.getElementById(id);

  function fmtMs(ms) {
    ms = Number(ms);
    if (!Number.isFinite(ms) || ms <= 0) return "—";
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    const mm = ms % 1000;
    return `${m}:${String(s).padStart(2,"0")}.${String(mm).padStart(3,"0")}`;
  }

  async function fetchJsonWithRetry(url, tries = 3) {
    let lastErr;
    for (let i = 0; i < tries; i++) {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(`${r.status} ${url}`);
        return await r.json();
      } catch (e) {
        lastErr = e;
        // Render cold start: brief backoff
        await new Promise(r => setTimeout(r, 700 + i * 700));
      }
    }
    throw lastErr;
  }

  function setStatus(text, ok = true) {
    const el = $("status");
    el.textContent = text;
    el.className = ok ? "ok" : "error";
  }

  function renderWeeksSelect(weeks) {
    const sel = $("weekSel");
    sel.innerHTML = "";
    for (const w of weeks) {
      const opt = document.createElement("option");
      opt.value = String(w.week);
      opt.textContent = `Week ${w.week} — ${w.mapName || "Weekly Shorts"}`;
      sel.appendChild(opt);
    }
  }

  function renderWeek(weekJson) {
    $("weekTitle").textContent = `Week ${weekJson.week} — ${weekJson.mapName || "Weekly Shorts"}`;
    $("weekMeta").textContent = `Map UID: ${weekJson.mapUid || "—"}${weekJson.endedAt ? ` • Ended: ${weekJson.endedAt}` : ""}`;
    $("weekGenerated").textContent = "";

    const body = $("weekBody");
    body.innerHTML = "";

    const entries = Array.isArray(weekJson.entries) ? weekJson.entries : [];
    if (!entries.length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="4" class="muted">No entries</td>`;
      body.appendChild(tr);
      return;
    }

    for (const e of entries) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${e.rank ?? "—"}</td>
        <td>${e.player ?? "—"}</td>
        <td>${fmtMs(e.timeMs)}</td>
        <td>${e.isWr ? `<span class="badge">WR</span>` : ""}</td>
      `;
      body.appendChild(tr);
    }
  }

  function renderAggregate(agg, filterText) {
    $("aggGenerated").textContent = agg?.generatedAt ? `Generated: ${agg.generatedAt}` : "";

    const body = $("aggBody");
    body.innerHTML = "";

    const rows = Array.isArray(agg.players) ? agg.players : [];
    const q = (filterText || "").trim().toLowerCase();
    const filtered = q ? rows.filter(r => String(r.player||"").toLowerCase().includes(q)) : rows;

    if (!filtered.length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="4" class="muted">No players</td>`;
      body.appendChild(tr);
      return;
    }

    for (const p of filtered.slice(0, 250)) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.player}</td>
        <td>${p.wins ?? 0}</td>
        <td>${p.wrs ?? 0}</td>
        <td>${p.top5 ?? 0}</td>
      `;
      body.appendChild(tr);
    }
  }

  function renderChangelog(chg) {
    const body = $("chgBody");
    body.innerHTML = "";

    const items = Array.isArray(chg.items) ? chg.items : [];
    if (!items.length) {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td colspan="3" class="muted">No changelog entries yet</td>`;
      body.appendChild(tr);
      return;
    }

    for (const it of items.slice(0, 200)) {
      const tr = document.createElement("tr");
      const msg = it.type === "WR_IMPROVED_AFTER_WEEK"
        ? `${it.playerNew} improved WR (${fmtMs(it.timePrevMs)} → ${fmtMs(it.timeNewMs)})`
        : JSON.stringify(it);

      tr.innerHTML = `
        <td>${it.at || "—"}</td>
        <td>${it.week ?? "—"}</td>
        <td>${msg}</td>
      `;
      body.appendChild(tr);
    }
  }

  async function loadAll() {
    setStatus("Loading…", true);

    const weeksIndex = await fetchJsonWithRetry(PATHS.weeksIndex);
    const weeks = Array.isArray(weeksIndex.weeks) ? weeksIndex.weeks : [];

    if (!weeks.length) {
      setStatus("No weeks found (check WS campaign discovery on server).", false);
      renderWeeksSelect([]);
      renderWeek({ week: "—", entries: [] });
      renderAggregate({ players: [] }, "");
      renderChangelog({ items: [] });
      return;
    }

    // Latest week auto-select
    const latest = weeks.reduce((a, b) => (Number(a.week) > Number(b.week) ? a : b), weeks[0]);

    renderWeeksSelect(weeks);
    $("weekSel").value = String(latest.week);

    const [weekJson, agg, chg] = await Promise.all([
      fetchJsonWithRetry(PATHS.weekFile(latest.week)),
      fetchJsonWithRetry(PATHS.aggregate),
      fetchJsonWithRetry(PATHS.changelog),
    ]);

    renderWeek(weekJson);
    renderAggregate(agg, $("search").value);
    renderChangelog(chg);

    setStatus("OK", true);

    $("weekSel").addEventListener("change", async () => {
      try {
        setStatus("Loading week…", true);
        const w = $("weekSel").value;
        const weekJson = await fetchJsonWithRetry(PATHS.weekFile(w));
        renderWeek(weekJson);
        setStatus("OK", true);
      } catch (e) {
        setStatus(`Week load failed: ${e?.message || e}`, false);
      }
    });

    $("search").addEventListener("input", () => renderAggregate(agg, $("search").value));
  }

  loadAll().catch((e) => {
    setStatus(`Load failed: ${e?.message || e}`, false);
  });
</script>
</body>
</html>
