<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kacky Reloaded 6 Leaderboard — Trackmania Events</title>
  <meta name="description" content="Redirecting to the Kacky Reloaded 6 leaderboard page." />
  <meta http-equiv="refresh" content="2; url=https://kacky.gg/leaderboard" />
  <style>
    :root {
      --bg:#0a0f1a;
      --text:#e6ecff;
      --muted:#9bb0ff;
      --accent:#3aa0ff;
      --accent-2:#6dfbff;
      --border:rgba(109,251,255,.22);
      --accent-glow:0 0 24px rgba(61,165,255,.35),0 0 48px rgba(61,165,255,.2);
    }

    * { box-sizing:border-box; margin:0; padding:0 }

    html, body { height:100% }

    body {
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(58,160,255,.10), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(109,251,255,.08), transparent 70%),
        linear-gradient(180deg, #07101c, #0a0f1a 40%, #060a14 100%);
      color:var(--text);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      position:relative;
      overflow:hidden;
    }

    /* === Background curves === */
    body::before {
      content:"";
      position:fixed; inset:0; pointer-events:none; z-index:-1;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%236DAFFF' stop-opacity='.10'/><stop offset='100%' stop-color='%233AE0FF' stop-opacity='.06'/></linearGradient><filter id='blur'><feGaussianBlur stdDeviation='1.4'/></filter></defs><g fill='none' stroke='url(%23g)' stroke-width='2' filter='url(%23blur)'><path d='M-100 700 C300 620 450 480 900 520 C1100 540 1300 620 1400 680'/><path d='M-120 520 C260 460 520 390 940 420 C1180 440 1320 520 1420 600' stroke-width='1.5'/><path d='M-140 350 C220 330 520 300 900 330 C1180 350 1360 420 1500 520' stroke-width='1'/></g></svg>");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      opacity:.6;
      mix-blend-mode:screen;
    }

    /* === Header === */
    header {
      width:100%;
      background:linear-gradient(180deg, rgba(10,15,26,.92), rgba(10,15,26,.72) 60%, rgba(10,15,26,0));
      backdrop-filter:blur(8px);
      position:fixed;
      top:0;
      border-bottom:1px solid rgba(109,251,255,.18);
      z-index:50;
    }

    .nav-container {
      width:min(1200px,92vw);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:1rem 0;
    }

    .brand {
      font-weight:800;
      font-size:1.1rem;
      letter-spacing:.3px;
      color:var(--accent-2);
      display:flex;
      align-items:center;
      gap:.5rem;
    }

    .btn {
      padding:.6rem .95rem;
      border:1px solid rgba(109,251,255,.25);
      border-radius:12px;
      background:linear-gradient(180deg,rgba(16,24,44,.9),rgba(16,24,44,.6));
      color:var(--text);
      font-weight:700;
      transition:.2s;
      text-decoration:none;
    }

    .btn:hover {
      transform:translateY(-1px) scale(1.02);
      filter:brightness(1.06);
    }

    /* === Centered content === */
    main {
      margin-top:120px;
      max-width:600px;
      padding:1rem;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:1rem;
    }

    h1 {
      font-size:2rem;
      text-shadow:0 0 12px rgba(61,165,255,.25);
    }

    p {
      font-size:1rem;
      color:var(--muted);
    }

    a.link {
      color:var(--accent);
      font-weight:600;
      text-decoration:none;
    }

    a.link:hover {
      text-decoration:underline;
    }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="brand">🏎️ Kacky Reloaded 6 Leaderboard</div>
      <a href="/" class="btn">Home</a>
    </div>
  </header>

  <main>
    <h1>Redirecting to the Kacky Reloaded 6 Leaderboard…</h1>
    <p>If you’re not redirected automatically, <a class="link" href="https://kacky.gg/leaderboard">click here</a>.</p>
  </main>

  <script>
    // JS fallback in case meta refresh doesn't trigger
    setTimeout(() => {
      window.location.replace("https://kacky.gg/leaderboard");
    }, 2000);
  </script>
</body>
</html>
