name: Update Data (TOTD + WR Data)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PUBLIC_DIR: .
      DEBUG: "0"

      REFRESH_TOKEN: ${{ secrets.NADEO_REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # -------------------------------
      # TOTD FETCHER
      # -------------------------------
      - name: Run TOTD fetcher
        run: |
          echo "Running TOTD fetcher..."
          node scripts/totd-fetcher.js

      # -------------------------------
      # REBUILD TOTD MONTHS INDEX
      # -------------------------------
      - name: Rebuild TOTD months index
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const dir = path.join(process.cwd(), "data", "totd");

          if (!fs.existsSync(dir)) {
            console.log("No data/totd directory.");
            process.exit(0);
          }

          const months = fs.readdirSync(dir)
            .filter(f => /^\d{4}-\d{2}\.json$/.test(f))
            .map(f => f.replace(".json",""))
            .sort()
            .reverse();

          fs.writeFileSync(
            path.join(dir,"months.json"),
            JSON.stringify({ months }, null, 2)
          );

          console.log("Updated months.json");
          NODE

      # -------------------------------
      # BUILD WR STATIC JSON
      # -------------------------------
      - name: Build WR static JSON
        run: |
          echo "Building WR leaderboard + recent WR JSON..."
          node scripts/build-wr-data.js

      # -------------------------------
      # COMMIT DATA
      # -------------------------------
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true

          git add totd.json
          git add data/totd
          git add data/recent-wrs
          git add data/wr-leaderboard

          if ! git diff --cached --quiet; then
            git commit -m "data: refresh TOTD + WR JSON [skip ci]"
            git push
          else
            echo "No changes."
          fi
