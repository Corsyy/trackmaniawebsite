name: Update Data (TOTD + Weekly Shorts)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PUBLIC_DIR: .
      DEBUG: "0"

      # Weekly Shorts auth (needed for player display names / leaderboards)
      REFRESH_TOKEN: ${{ secrets.NADEO_REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TOTD fetcher
        run: |
          echo "Running TOTD fetcher..."
          node -v
          node scripts/totd-fetcher.js
          echo ""
          ls -R data/totd || true
          ls -l totd.json || true

      - name: Run Weekly Shorts updater
        continue-on-error: true
        run: |
          echo "Running Weekly Shorts updater..."
          node -v
          node scripts/weekly-shorts-update.js
          echo ""
          ls -R data/weekly-shorts || true

      - name: Commit updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # stage both datasets (include months.json!)
          git add totd.json data/totd/*.json data/totd/months.json data/weekly-shorts/**/*.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "data: refresh TOTD + Weekly Shorts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true
            git push
          else
            echo "No changes."
          fi
