name: Update TOTD

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC = 1:00 PM EST (no DST auto-switch)
    - cron: "0 18 * * *"

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_DIR: .
      DEBUG: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TOTD fetcher
        run: |
          echo "Running TOTD fetcher..."
          node -v
          node scripts/totd-fetcher.js
          echo ""
          echo "Listing generated files:"
          ls -R data/totd || true
          echo ""
          echo "Root snapshot:"
          ls -l totd.json || true

      # Weekly Shorts updater (non-blocking) + correct secret mapping
      - name: Run Weekly Shorts updater
        continue-on-error: true
        env:
          REFRESH_TOKEN: ${{ secrets.NADEO_REFRESH_TOKEN }}
          CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}
        run: |
          echo "Running Weekly Shorts updater..."
          node -v
          node scripts/weekly-shorts-update.js
          echo ""
          echo "Listing generated files:"
          ls -R data/weekly-shorts || true

      # ==========================
      # TOTD hash + commit gating
      # ==========================

      - name: Compute new TOTD content hash
        id: newhash
        shell: bash
        run: |
          set -euo pipefail
          tmplist=$(mktemp)

          if [ -f totd.json ]; then
            echo "totd.json" >> "$tmplist"
          fi
          if [ -d data/totd ]; then
            find data/totd -type f -name '*.json' -print0 | sort -z | xargs -0 -I{} echo "{}" >> "$tmplist"
          fi

          if [ -s "$tmplist" ]; then
            HASH=$(xargs -a "$tmplist" -I{} sha256sum "{}" | sort | sha256sum | cut -d' ' -f1)
          else
            HASH="none"
          fi

          echo "new=$HASH" >> "$GITHUB_OUTPUT"

      - name: Read previous TOTD hash (if any)
        id: prevhash
        shell: bash
        run: |
          PREV=$(git show HEAD:.totd.hash 2>/dev/null || true)
          echo "prev=${PREV:-none}" >> "$GITHUB_OUTPUT"

      - name: Commit updated TOTD data (only if changed)
        if: steps.newhash.outputs.new != steps.prevhash.outputs.prev
        run: |
          echo "${{ steps.newhash.outputs.new }}" > .totd.hash

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Include months.json so new months (Feb) appear properly
          git add .totd.hash totd.json data/totd/*.json data/totd/months.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            echo "Changes detected — committing TOTD updates."
            git commit -m "data: refresh TOTD [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true
            git push
          else
            echo "No staged changes (hash matched)."
          fi

      - name: No TOTD changes — skip
        if: steps.newhash.outputs.new == steps.prevhash.outputs.prev
        run: echo "No TOTD content changes detected; nothing to push."

      # =======================================
      # Weekly Shorts hash + commit gating
      # =======================================

      - name: Compute Weekly Shorts content hash
        id: wshash
        shell: bash
        run: |
          set -euo pipefail
          tmplist=$(mktemp)

          if [ -d data/weekly-shorts ]; then
            find data/weekly-shorts -type f -name '*.json' -print0 | sort -z | xargs -0 -I{} echo "{}" >> "$tmplist"
          fi

          if [ -s "$tmplist" ]; then
            HASH=$(xargs -a "$tmplist" -I{} sha256sum "{}" | sort | sha256sum | cut -d' ' -f1)
          else
            HASH="none"
          fi

          echo "new=$HASH" >> "$GITHUB_OUTPUT"

      - name: Read previous Weekly Shorts hash (if any)
        id: wsprevious
        shell: bash
        run: |
          PREV=$(git show HEAD:.weeklyshorts.hash 2>/dev/null || true)
          echo "prev=${PREV:-none}" >> "$GITHUB_OUTPUT"

      - name: Commit updated Weekly Shorts data (only if changed)
        if: steps.wshash.outputs.new != steps.wsprevious.outputs.prev
        run: |
          echo "${{ steps.wshash.outputs.new }}" > .weeklyshorts.hash

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .weeklyshorts.hash data/weekly-shorts/**/*.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            echo "Weekly Shorts changes detected — committing updates."
            git commit -m "data: refresh Weekly Shorts [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true
            git push
          else
            echo "No staged Weekly Shorts changes (hash matched)."
          fi

      - name: No Weekly Shorts changes — skip
        if: steps.wshash.outputs.new == steps.wsprevious.outputs.prev
        run: echo "No Weekly Shorts content changes detected; nothing to push."
