name: Update TOTD

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: update-totd
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLIC_DIR: .
      DEBUG: "1"
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TOTD fetcher
        run: |
          echo "Running TOTD fetcher..."
          node -v
          node scripts/totd-fetcher.js

          echo ""
          echo "Listing generated TOTD files:"
          ls -R data/totd || true

          echo ""
          echo "Listing generated TOTD leaderboard files:"
          ls -R data/totd-leaderboards || true

          echo ""
          echo "Root snapshot:"
          ls -l totd.json || true

      - name: Compute new content hash
        id: newhash
        shell: bash
        run: |
          set -euo pipefail

          tmplist=$(mktemp)

          if [ -f totd.json ]; then
            echo "totd.json" >> "$tmplist"
          fi

          if [ -d data/totd ]; then
            find data/totd -type f -name '*.json' -print0 | sort -z | xargs -0 -I{} echo "{}" >> "$tmplist"
          fi

          if [ -d data/totd-leaderboards ]; then
            find data/totd-leaderboards -type f -name '*.json' -print0 | sort -z | xargs -0 -I{} echo "{}" >> "$tmplist"
          fi

          if [ -s "$tmplist" ]; then
            HASH=$(xargs -a "$tmplist" -I{} sha256sum "{}" | sort | sha256sum | cut -d' ' -f1)
          else
            HASH="none"
          fi

          echo "new=$HASH" >> "$GITHUB_OUTPUT"

      - name: Read previous hash
        id: prevhash
        shell: bash
        run: |
          PREV=$(git show HEAD:.totd.hash 2>/dev/null || true)
          echo "prev=${PREV:-none}" >> "$GITHUB_OUTPUT"

      - name: Commit updated TOTD data
        if: steps.newhash.outputs.new != steps.prevhash.outputs.prev
        run: |
          echo "${{ steps.newhash.outputs.new }}" > .totd.hash

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .totd.hash totd.json data/totd/*.json data/totd-leaderboards/*.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            echo "Changes detected — committing updates."
            git commit -m "data: refresh TOTD [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true
            git push
          else
            echo "No staged changes."
          fi

      - name: No changes
        if: steps.newhash.outputs.new == steps.prevhash.outputs.prev
        run: echo "No content changes detected; nothing to push."
