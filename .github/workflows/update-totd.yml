name: Update Data (TOTD)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PUBLIC_DIR: .
      DEBUG: "0"

      # Weekly Shorts auth (needed for player display names / leaderboards)
      REFRESH_TOKEN: ${{ secrets.NADEO_REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run TOTD fetcher
        run: |
          echo "Running TOTD fetcher..."
          node -v
          node scripts/totd-fetcher.js
          echo ""
          ls -R data/totd || true
          ls -l totd.json || true

      # ✅ Always rebuild months.json from actual files on disk
      - name: Rebuild TOTD months index from files
        shell: bash
        run: |
          echo "Rebuilding data/totd/months.json from existing month files..."
          node - <<'NODE'
          const fs = require("fs");
          const path = require("path");

          const dir = path.join(process.cwd(), "data", "totd");
          if (!fs.existsSync(dir)) {
            console.log("No data/totd directory; skipping months.json rebuild.");
            process.exit(0);
          }

          const months = fs.readdirSync(dir)
            .filter(f => /^\d{4}-\d{2}\.json$/.test(f))
            .map(f => f.replace(/\.json$/, ""))
            .sort()
            .reverse();

          const outPath = path.join(dir, "months.json");
          fs.writeFileSync(outPath, JSON.stringify({ months }, null, 2) + "\n", "utf8");
          console.log("Wrote", outPath, "with", months.length, "months. Newest:", months[0] || "(none)");
          NODE

          echo ""
          cat data/totd/months.json || true

      - name: Commit updates
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull first to reduce push/rebase issues
          git pull --rebase origin "${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}" || true

          # Stage outputs (avoid ** glob surprises by staging folder)
          git add totd.json data/totd/*.json data/totd/months.json 2>/dev/null || true

          if ! git diff --cached --quiet; then
            git commit -m "data: refresh TOTD + Weekly Shorts [skip ci]"
            git push
          else
            echo "No changes."
          fi
