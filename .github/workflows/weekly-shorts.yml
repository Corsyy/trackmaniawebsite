name: Update Weekly Shorts (static JSON)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: weekly-shorts
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PUBLIC_DIR: .
      DEBUG: "0"

      REFRESH_TOKEN: ${{ secrets.NADEO_REFRESH_TOKEN }}
      CLIENT_ID: ${{ secrets.TM_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.TM_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps (if package-lock exists)
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "No package-lock.json, skipping npm ci"
          fi

      - name: Run Weekly Shorts updater
        id: update
        run: node scripts/weekly-shorts-update.js

      - name: Rotate NADEO refresh token
        if: success() && steps.update.outputs.new_refresh_token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_ROTATION_PAT }}
          NEW_REFRESH_TOKEN: ${{ steps.update.outputs.new_refresh_token }}
        run: |
          gh secret set NADEO_REFRESH_TOKEN --body "$NEW_REFRESH_TOKEN"

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            data/weekly-shorts/weeks.json \
            data/weekly-shorts/aggregate.json \
            data/weekly-shorts/changelog.json \
            data/weekly-shorts/wr-state.json \
            data/weekly-shorts/postweek-map-state.json \
            data/weekly-shorts/weeks \
            data/weekly-shorts/name-cache.json \
            data/weekly-shorts/goat-weeks.json \
            data/weekly-shorts/goat-aggregate.json \
            data/weekly-shorts/goat-weeks

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Weekly Shorts data"
          git push
