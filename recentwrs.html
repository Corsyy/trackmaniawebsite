<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recent World Records — Trackmania Events</title>
  <meta name="description" content="Most recent Trackmania world records across all official campaigns, TOTD, and club campaigns."/>
  <meta name="theme-color" content="#0a0f1a"/>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/logo.png">
  <style>
:root{
  --bg:#0a101a;
  --bg-2:#0d1422;
  --bg-3:#0b1220;

  --panel:#10192a;
  --panel-2:#0d1524;
  --panel-3:#0b1220;

  --text:#eef3ff;
  --muted:#9fb2df;
  --soft:#cfdcff;

  --accent:#4aa3ff;
  --accent-2:#6dfbff;
  --ok:#29d98f;
  --warn:#ffb02e;

  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.12);

  --shadow-sm:0 8px 22px rgba(0,0,0,.20);
  --shadow-md:0 16px 36px rgba(0,0,0,.24);
  --shadow-lg:0 24px 50px rgba(0,0,0,.28);

  --radius:20px;
  --radius-sm:12px;

  --ring:0 0 0 3px rgba(74,163,255,.18);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
  background:#0a101a;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body.bg-track-curves{
  background:#0a101a;
}

body.bg-track-curves::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.018;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
  background-size:220px 220px;
}

body.bg-track-curves::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(900px 420px at 50% -220px, rgba(74,163,255,.08), transparent 60%);
  opacity:1;
}

a{color:inherit;text-decoration:none}

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(10,16,26,.88);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.04);
}

.container{
  width:min(1220px,92vw);
  margin:0 auto;
}

.nav{
  display:grid;
  grid-template-columns:auto 1fr auto;
  align-items:center;
  gap:1rem;
  padding:1rem 0 .85rem;
}

.brand{
  display:flex;
  align-items:center;
  gap:.75rem;
  font-weight:950;
  letter-spacing:-.02em;
  color:#f7faff;
  font-size:1.08rem;
}

.brand-badge{
  width:38px;
  height:38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(180deg,#18263d,#132036);
  border:1px solid var(--border);
  box-shadow:none;
  transition:transform .18s ease, border-color .18s ease, background .18s ease;
}

.brand:hover .brand-badge{
  transform:translateY(-1px);
  border-color:var(--border-strong);
  background:#1a2944;
}

.navlinks{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:1.45rem;
}

.nav a{
  color:var(--muted);
  white-space:nowrap;
  font-size:.95rem;
  font-weight:800;
  letter-spacing:.01em;
  opacity:.92;
  transition:color .18s ease, opacity .18s ease;
}

.nav a:hover,
.nav a:focus{
  opacity:1;
  color:#ffffff;
}

.nav a.active{
  opacity:1;
  color:#ffffff;
  position:relative;
}

.nav a.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-9px;
  height:2px;
  border-radius:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
}

.cta{
  display:flex;
  justify-content:flex-end;
  gap:.6rem;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  min-height:42px;
  padding:.62rem 1rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:#121d31;
  color:var(--text);
  font-weight:850;
  font-size:.92rem;
  line-height:1;
  transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  box-shadow:none;
  cursor:pointer;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--border-strong);
  background:#16233a;
  box-shadow:var(--shadow-sm);
}

.btn:focus{
  outline:none;
  box-shadow:var(--ring);
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

.nav-toggle{
  display:none;
  border:1px solid var(--border);
  background:#131e31;
  color:var(--text);
  border-radius:10px;
  padding:.5rem .7rem;
  cursor:pointer;
  font-weight:800;
}

main{
  max-width:1100px;
  margin:auto;
  padding:2rem 1.2rem 2.6rem;
}

h1{
  font-size:clamp(1.8rem,3vw,2.4rem);
  font-weight:950;
  letter-spacing:-.03em;
  line-height:1.08;
  margin-bottom:.45rem;
  color:#f7faff;
}

.meta{
  color:var(--muted);
  font-size:.95rem;
  margin-bottom:1rem;
}

.pager{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.8rem;
  margin:.95rem 0 1rem;
}

#pageInfo{
  color:var(--muted);
  font-weight:700;
  margin:0;
}

.card{
  border:1px solid var(--border);
  background:linear-gradient(180deg, rgba(16,25,42,.98), rgba(11,18,32,.98));
  border-radius:20px;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  padding:1rem;
}

.card:hover{
  transform:translateY(-2px);
  border-color:var(--border-strong);
  box-shadow:var(--shadow-md);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:.85rem .75rem;
  text-align:left;
}

th{
  font-size:.82rem;
  letter-spacing:.05em;
  text-transform:uppercase;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  font-weight:850;
}

td{
  border-bottom:1px solid rgba(255,255,255,.05);
  color:var(--text);
}

tr:last-child td{
  border-bottom:none;
}

tbody tr{
  transition:background .16s ease;
}

tbody tr:hover{
  background:rgba(255,255,255,.02);
}

.time{
  font-variant-numeric:tabular-nums;
}

.ts{
  opacity:.78;
}

.truncate{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.skeleton{
  color:var(--muted);
}

@media (max-width:640px){
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }

  .nav-toggle{
    display:block;
  }

  .navlinks{
    display:none;
    position:absolute;
    top:64px;
    left:0;
    right:0;
    padding:.85rem 1rem 1rem;
    background:rgba(10,16,26,.97);
    backdrop-filter:blur(8px);
    flex-direction:column;
    gap:.7rem;
    border-top:1px solid var(--border);
  }

  .navlinks.show{display:flex}
  .cta{display:none}

  table.mobile-stack thead{
    display:none;
  }

  table.mobile-stack,
  table.mobile-stack tbody,
  table.mobile-stack tr,
  table.mobile-stack td{
    display:block;
    width:100%;
  }

  table.mobile-stack tr{
    background:linear-gradient(180deg, rgba(16,25,42,.98), rgba(11,18,32,.98));
    padding:.75rem .8rem;
    margin-bottom:.7rem;
    border-radius:14px;
    border:1px solid var(--border);
    box-shadow:0 8px 20px rgba(0,0,0,.22);
  }

  table.mobile-stack td{
    display:grid;
    grid-template-columns:100px 1fr;
    gap:.45rem;
    font-size:.92rem;
    padding:.45rem 0;
    border-bottom:1px solid rgba(255,255,255,.05);
  }

  table.mobile-stack td:last-child{
    border-bottom:none;
  }

  table.mobile-stack td::before{
    content:attr(data-label);
    color:var(--muted);
    font-weight:800;
  }
}

<main>
  <h1>Most Recent World Records on TOTD, official campaign and official club campaigns</h1>
  <div id="meta" class="meta">Loading…</div>

  <div class="pager">
    <button id="prevBtn" class="btn">Prev</button>
    <span id="pageInfo" class="meta"></span>
    <button id="nextBtn" class="btn">Next</button>
  </div>

  <div class="card">

          <th class="ts">Set</th>

      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="skeleton">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const API_BASE = "https://trackmaniawebsite.onrender.com";
const PAGE_SIZE = 25;    // rows per page
const FETCH_LIMIT = 100; // how many records to fetch once

let allRows = [];
let page = Number(new URLSearchParams(location.search).get('page')) || 1;

function fmt(ms){
  if(!Number.isFinite(ms)) return "—";
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), x=ms%1000;
  const pad=(n,w=2)=>String(n).padStart(w,"0");
  return `${pad(m)}:${pad(s)}:${String(x).padStart(3,"0")}`;
}
function fmtTs(ts){
  if (ts === null || ts === undefined) return "—";
  const n = Number(ts);
  const ms = Number.isFinite(n) ? (n > 1e12 ? n : n*1000) : Date.parse(ts);
  return isNaN(ms) ? "—" : new Date(ms).toLocaleString();
}

/* ========== NEW: helpers to safely render clickable player links ========== */
function escapeHTML(s=''){
  return s.replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function playerLinkHTML({ id, name }) {
  return escapeHTML(name || id || '—');
}
/* ======================================================================== */

async function resolveNames(ids = []) {
  if (!ids.length) return {};
  try {
    const url = `${API_BASE}/api/debug-names?ids=${encodeURIComponent(ids.join(","))}`;
    const r = await fetch(url);
    if (!r.ok) return {};
    const data = await r.json();
    const arr = Array.isArray(data?.data) ? data.data : [];
    const map = {};
    for (const row of arr) {
      if (row && row.id) map[row.id] = row.name || row.id;
    }
    return map;
  } catch {
    return {};
  }
}

function renderPage(p = 1) {
  const total = allRows.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(Math.max(1, p), totalPages);

  const start = (page - 1) * PAGE_SIZE;
  const slice = allRows.slice(start, start + PAGE_SIZE);

  const $rows = document.getElementById("rows");
  $rows.innerHTML = "";

  slice.forEach((row, i) => {
    const pretty = row.prettyName || row.displayName || row.accountId || "—";
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td data-label="#">${start + i + 1}</td>` +
      `<td data-label="Map UID"><span class="truncate">${escapeHTML(row.mapUid || '')}</span></td>` +
      `<td data-label="Holder"><span class="truncate">${playerLinkHTML({ id: row.accountId, name: pretty })}</span></td>` +
      `<td data-label="WR Time" class="time">${row.timeMs != null ? fmt(row.timeMs) : "—"}</td>` +
      `<td data-label="Set" class="ts">${fmtTs(row.timestamp)}</td>`;
    $rows.appendChild(tr);
  });

  // pager controls
  document.getElementById("pageInfo").textContent = `Page ${page} of ${totalPages}`;
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  prev.disabled = page <= 1;
  next.disabled = page >= totalPages;
  prev.onclick = () => goTo(page - 1);
  next.onclick = () => goTo(page + 1);

  // keep ?page in URL
  const params = new URLSearchParams(location.search);
  params.set('page', page);
  history.replaceState({}, '', `${location.pathname}?${params}`);
}

function goTo(p){ if (p >= 1) renderPage(p); }

async function load(){
  try {
    document.getElementById("rows").innerHTML = `<tr><td colspan="5" class="skeleton">Loading…</td></tr>`;
    const res = await fetch(`${API_BASE}/api/wr-latest?limit=${FETCH_LIMIT}`, { cache: "no-store" });
    if (!res.ok) throw new Error(await res.text());
    const j = await res.json();
    const rows = Array.isArray(j.rows) ? j.rows : [];

    // collect ids lacking proper names
    const needIds = [...new Set(rows
      .filter(r => r.accountId && (!r.displayName || r.displayName === r.accountId))
      .map(r => r.accountId))];

    const names = await resolveNames(needIds);

    // attach prettyName once
    allRows = rows.map(r => ({ ...r, prettyName: names[r.accountId] || r.displayName || r.accountId }));

    const ago = Math.max(0, Date.now() - (j.fetchedAt || 0));
    document.getElementById("meta").textContent =
      `Fetched ${Math.round(ago/1000)}s ago — ${new Date(j.fetchedAt || Date.now()).toLocaleTimeString()}`;

    renderPage(page);
  } catch (e) {
    console.error(e);
    document.getElementById("meta").textContent = "Failed to load recent WRs.";
    document.getElementById("rows").innerHTML = `<tr><td colspan="5">Error loading data.</td></tr>`;
  }
}

// initial
load();
// optional light auto-refresh
setInterval(() => load(), 60 * 60 * 1000); // once every hour
</script>

<script>
  // keep server warm
  setInterval(() => {
    fetch('https://trackmaniawebsite.onrender.com/api/ping').catch(()=>{});
  }, 5 * 60 * 1000);
  // prefetches
  const prefetch = (url) => {
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    link.as = 'fetch';
    link.crossOrigin = 'anonymous';
    document.head.appendChild(link);
  };
  const wrBtn = document.querySelector('a[href="/wrleaderboard"]');
  const tblBtn = document.querySelector('a[href="/recentwrs"]');
  if (wrBtn) wrBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-players?limit=100'), { once:true });
  if (tblBtn) tblBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-latest?limit=100'), { once:true });
</script>
