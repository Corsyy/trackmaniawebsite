<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recent World Records — Trackmania Events</title>
  <meta name="description"
    content="Most recent Trackmania world records across official campaigns, TOTD, club campaigns, and verified TMX maps." />
  <meta name="theme-color" content="#0a0f1a" />
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/logo.png">
  <style>
    :root {
      --bg: #05070c;
      --bg-2: #080b11;
      --bg-3: #0b0f16;

      --panel: rgba(255, 255, 255, .035);
      --panel-2: rgba(255, 255, 255, .028);
      --panel-3: rgba(255, 255, 255, .02);

      --text: #f3f5f7;
      --muted: #a7adb8;
      --soft: #d7dbe2;

      --border: rgba(255, 255, 255, .07);
      --border-strong: rgba(255, 255, 255, .12);

      --shadow-sm: 0 10px 26px rgba(0, 0, 0, .22);
      --shadow-md: 0 18px 42px rgba(0, 0, 0, .30);
      --shadow-lg: 0 26px 56px rgba(0, 0, 0, .34);

      --radius: 20px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial;
      background: #05070c;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body.bg-track-curves {
      background: #05070c;
    }

    body.bg-track-curves::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: .014;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
      background-size: 220px 220px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;

      background: rgba(5, 7, 12, .82);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border-bottom: 1px solid rgba(255, 255, 255, .05);
    }

    .container {
      width: min(1220px, 92vw);
      margin: 0 auto;
    }

    .nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 1rem;
      padding: 1rem 0 .9rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .75rem;
      font-weight: 950;
      letter-spacing: -.02em;
      color: #f7faff;
      font-size: 1.05rem;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;

      background: rgba(255, 255, 255, .045);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid var(--border);

      transition: .18s ease;
    }

    .brand:hover .brand-badge {
      transform: translateY(-1px);
      border-color: var(--border-strong);
    }

    .navlinks {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.45rem;
    }

    .nav a {
      color: var(--muted);
      white-space: nowrap;
      font-size: .94rem;
      font-weight: 800;
      letter-spacing: .01em;
      opacity: .92;
      transition: .18s ease;
    }

    .nav a:hover,
    .nav a:focus {
      opacity: 1;
      color: #ffffff;
    }

    .nav a.active {
      opacity: 1;
      color: #ffffff;
      position: relative;
    }

    .nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -9px;
      height: 2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .24);
    }

    .cta {
      display: flex;
      justify-content: flex-end;
      gap: .6rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;

      min-height: 42px;

      padding: .62rem 1rem;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: rgba(255, 255, 255, .045);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      color: var(--text);

      font-weight: 850;
      font-size: .92rem;
      line-height: 1;

      transition: .18s ease;

      cursor: pointer;
    }

    .btn:hover {
      transform: translateY(-2px);

      border-color: var(--border-strong);

      background: rgba(255, 255, 255, .065);

      box-shadow: var(--shadow-sm);
    }

    .btn:focus {
      outline: none;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .nav-toggle {
      display: none;

      border: 1px solid var(--border);

      background: rgba(255, 255, 255, .045);

      color: var(--text);

      border-radius: 12px;

      padding: .5rem .7rem;

      cursor: pointer;

      font-weight: 800;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 2rem 1.2rem 2.6rem;
    }

    h1 {
      font-size: clamp(1.8rem, 3vw, 2.4rem);
      font-weight: 950;
      letter-spacing: -.03em;
      line-height: 1.08;
      margin-bottom: .45rem;
      color: #f7faff;
    }

    .meta {
      color: var(--muted);
      font-size: .95rem;
      margin-bottom: 1rem;
    }

    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .8rem;
      margin: .95rem 0 1rem;
    }

    #pageInfo {
      color: var(--muted);
      font-weight: 700;
      margin: 0;
    }

    .card {
      border: 1px solid var(--border);

      background: rgba(255, 255, 255, .035);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      border-radius: 20px;

      box-shadow: 0 12px 30px rgba(0, 0, 0, .28);

      transition: .18s ease;

      padding: 1rem;
    }

    .card:hover {
      transform: translateY(-2px);

      border-color: var(--border-strong);

      box-shadow: var(--shadow-md);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: .85rem .75rem;
      text-align: left;
    }

    th {
      font-size: .82rem;
      letter-spacing: .05em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      font-weight: 850;
    }

    td {
      border-bottom: 1px solid rgba(255, 255, 255, .05);
      color: var(--text);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tbody tr {
      transition: background .16s ease;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, .02);
    }

    .time {
      font-variant-numeric: tabular-nums;
    }

    .ts {
      opacity: .74;
    }

    .truncate {
      display: inline-block;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skeleton {
      color: var(--muted);
    }

    * {
      scrollbar-color:
        rgba(255, 255, 255, .16) transparent;
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .16);
      border-radius: 999px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .24);
    }

    @media (max-width:640px) {

      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .nav-toggle {
        display: block;
      }

      .navlinks {
        display: none;

        position: absolute;
        top: 64px;
        left: 0;
        right: 0;

        padding: .9rem 1rem 1rem;

        background: rgba(5, 7, 12, .96);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        flex-direction: column;
        gap: .7rem;

        border-top: 1px solid var(--border);
      }

      .navlinks.show {
        display: flex;
      }

      .cta {
        display: none;
      }

      table.mobile-stack thead {
        display: none;
      }

      table.mobile-stack,
      table.mobile-stack tbody,
      table.mobile-stack tr,
      table.mobile-stack td {
        display: block;
        width: 100%;
      }

      table.mobile-stack tr {
        background: rgba(255, 255, 255, .03);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        padding: .8rem .85rem;

        margin-bottom: .7rem;

        border-radius: 16px;

        border: 1px solid var(--border);

        box-shadow: 0 10px 24px rgba(0, 0, 0, .24);
      }

      table.mobile-stack td {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: .45rem;

        font-size: .92rem;

        padding: .45rem 0;

        border-bottom: 1px solid rgba(255, 255, 255, .05);
      }

      table.mobile-stack td:last-child {
        border-bottom: none;
      }

      table.mobile-stack td::before {
        content: attr(data-label);
        color: var(--muted);
        font-weight: 800;
      }

    }


    /* Unified Trackmania Events header */
    .tme-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(5, 7, 12, .86);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .tme-header .container.nav {
      width: min(1220px, 92vw);
      margin: 0 auto;
      padding: .75rem 0;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
    }

    .tme-header .brand {
      display: flex;
      align-items: center;
      gap: .7rem;
      color: #f7faff;
      font-weight: 950;
      font-size: 1.02rem;
      letter-spacing: -.025em;
      white-space: nowrap;
      text-decoration: none;
    }

    .tme-header .brand-badge {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, .045);
      border: 1px solid rgba(255, 255, 255, .08);
      box-shadow: none;
    }

    .tme-header .navlinks {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      min-width: 0;
    }

    .tme-header .nav-group {
      position: relative;
    }

    .tme-header .nav-drop-btn,
    .tme-header .navlinks>a {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
      padding: .5rem .66rem;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: rgba(243, 245, 247, .72);
      font: inherit;
      font-size: .9rem;
      font-weight: 850;
      line-height: 1;
      letter-spacing: -.005em;
      white-space: nowrap;
      text-decoration: none;
      opacity: 1;
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, color .16s ease, transform .16s ease;
      box-shadow: none;
    }

    .tme-header .nav-drop-btn:hover,
    .tme-header .nav-drop-btn:focus,
    .tme-header .navlinks>a:hover,
    .tme-header .navlinks>a:focus,
    .tme-header .nav-drop-btn.active,
    .tme-header .navlinks>a.active {
      color: #fff;
      background: rgba(255, 255, 255, .055);
      border-color: rgba(255, 255, 255, .075);
      transform: none;
      box-shadow: none;
    }

    .tme-header .nav-drop-btn.active,
    .tme-header .navlinks>.nav-support-link.active {
      background: rgba(255, 255, 255, .075);
      border-color: rgba(255, 255, 255, .11);
    }

    .tme-header .navlinks a.active::after,
    .tme-header .nav a.active::after {
      display: none !important;
    }

    .nav-group {
      position: relative;
    }

    .nav-group::after {
      content: "";
      position: absolute;
      left: -12px;
      right: -12px;
      top: 100%;
      height: 18px;
      background: transparent;
      pointer-events: auto;
    }

    .nav-drop-menu {
      top: calc(100% + 10px);
    }

    .nav-group:hover .nav-drop-menu,
    .nav-group:focus-within .nav-drop-menu,
    .nav-drop-menu:hover {
      display: flex;
    }

    .tme-header .nav-drop-menu {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      min-width: 230px;
      display: none;
      flex-direction: column;
      gap: .25rem;
      padding: .55rem;
      border-radius: 16px;
      background: rgba(8, 11, 18, .98);
      border: 1px solid rgba(255, 255, 255, .085);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 1001;
    }

    .tme-header .nav-group:hover .nav-drop-menu,
    .tme-header .nav-group:focus-within .nav-drop-menu,
    .tme-header .nav-group.open .nav-drop-menu {
      display: flex;
    }

    .tme-header .nav-drop-menu a {
      display: flex;
      align-items: center;
      min-height: 38px;
      padding: .65rem .72rem;
      border-radius: 12px;
      color: rgba(243, 245, 247, .68);
      text-decoration: none;
      font-size: .9rem;
      font-weight: 800;
      white-space: nowrap;
      transition: background .16s ease, color .16s ease;
    }

    .tme-header .nav-drop-menu a:hover,
    .tme-header .nav-drop-menu a:focus,
    .tme-header .nav-drop-menu a.active {
      color: #fff;
      background: rgba(255, 255, 255, .06);
    }

    .tme-header .nav-support-link {
      border-color: rgba(255, 255, 255, .10) !important;
      background: rgba(255, 255, 255, .045) !important;
    }

    .tme-header .nav-support-link:hover,
    .tme-header .nav-support-link.active {
      background: rgba(255, 255, 255, .075) !important;
      border-color: rgba(255, 255, 255, .14) !important;
    }

    .tme-header .cta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .55rem;
      position: static;
      transform: none;
    }

    .tme-header .btn,
    .tme-header .nav-submit,
    .tme-header .nav-account {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
      padding: .62rem .9rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .085);
      background: rgba(255, 255, 255, .045);
      color: #f3f5f7;
      font-weight: 850;
      font-size: .9rem;
      line-height: 1;
      white-space: nowrap;
      text-decoration: none;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
      box-shadow: none;
    }

    .tme-header .nav-submit {
      background: rgba(255, 255, 255, .075);
      border-color: rgba(255, 255, 255, .13);
    }

    .tme-header .btn:hover,
    .tme-header .nav-submit:hover,
    .tme-header .nav-account:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .075);
      box-shadow: none;
    }

    .tme-header .nav-mobile-action {
      display: none;
    }

    .tme-header .nav-toggle {
      display: none;
      min-height: 38px;
      width: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, .09);
      border-radius: 12px;
      background: rgba(255, 255, 255, .045);
      color: #f3f5f7;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
    }

    @media (max-width:1050px) {
      .tme-header .brand span:last-child {
        display: none
      }
    }

    @media (max-width:900px) {
      .tme-header .container.nav {
        grid-template-columns: auto auto;
      }

      .tme-header .brand span:last-child {
        display: inline
      }

      .tme-header .nav-toggle {
        display: inline-flex !important;
        justify-self: end;
      }

      .tme-header .cta {
        display: none !important;
      }

      .tme-header .navlinks {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        width: 100%;
        padding: .75rem min(4vw, 1rem) 1rem;
        border-bottom: 1px solid rgba(255, 255, 255, .07);
        background: rgba(5, 7, 12, .97);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: .45rem;
        z-index: 1000;
      }

      .tme-header .navlinks.show,
      .tme-header .navlinks.open {
        display: flex !important;
      }

      .tme-header .nav-group {
        width: 100%;
      }

      .tme-header .nav-drop-btn,
      .tme-header .navlinks>a {
        width: 100%;
        justify-content: space-between;
        min-height: 44px;
        padding: .75rem .85rem;
        background: rgba(255, 255, 255, .035);
        border-color: rgba(255, 255, 255, .06);
      }

      .tme-header .nav-drop-menu {
        position: static;
        display: none;
        min-width: 0;
        width: 100%;
        margin: .35rem 0 .15rem;
        padding: .45rem;
        box-shadow: none;
        background: rgba(255, 255, 255, .03);
        border-color: rgba(255, 255, 255, .06);
      }

      .tme-header .nav-group.open .nav-drop-menu {
        display: flex;
      }

      .tme-header .nav-mobile-action {
        display: flex;
      }
    }

    @media (max-width:520px) {
      .tme-header .brand span:last-child {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }

    .tme-header .auth-user-dropdown {
      position: relative;
    }

    .tme-header .auth-user-btn {
      display: inline-flex;
      align-items: center;
      gap: .42rem;
    }

    .tme-header .auth-caret {
      font-size: .78rem;
      opacity: .72;
    }

    .tme-header .auth-user-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: 220px;
      display: none;
      flex-direction: column;
      gap: .42rem;
      padding: .68rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, .085);
      background: rgba(8, 11, 18, .98);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .42);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 1002;
    }

    .tme-header .auth-user-menu.show {
      display: flex;
    }

    .tme-header .auth-user-info {
      display: flex;
      flex-direction: column;
      gap: .14rem;
      padding: 0 0 .55rem;
      margin: 0 0 .28rem;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
    }

    .tme-header .auth-user-info strong {
      color: #fff;
      font-size: .95rem;
      line-height: 1.2;
    }

    .tme-header .auth-user-info span {
      color: rgba(243, 245, 247, .56);
      font-size: .82rem;
      overflow-wrap: anywhere;
    }

    .tme-header .auth-user-menu button {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: .68rem .75rem;
      border: 0;
      border-radius: 12px;
      background: rgba(255, 255, 255, .04);
      color: #f3f5f7;
      font: inherit;
      font-size: .9rem;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      box-shadow: none;
    }

    .tme-header .auth-user-menu button:hover {
      transform: none;
      background: rgba(255, 255, 255, .075);
      box-shadow: none;
    }

    @media (max-width:900px) {
      .tme-header .auth-user-dropdown {
        display: none;
      }
    }



    /* Header cleanup v3: plain dropdowns, blue Support pill, no Submit Event on subpages */
    .tme-header .nav-drop-btn,
    .tme-header .nav-drop-btn.active {
      appearance: none !important;
      background: transparent !important;
      border-color: transparent !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      color: rgba(243, 245, 247, .72) !important;
      padding: .5rem .35rem !important;
      transform: none !important;
    }

    .tme-header .nav-drop-btn:hover,
    .tme-header .nav-drop-btn:focus,
    .tme-header .nav-group:hover .nav-drop-btn,
    .tme-header .nav-group:focus-within .nav-drop-btn {
      background: transparent !important;
      border-color: transparent !important;
      box-shadow: none !important;
      color: #fff !important;
      transform: none !important;
    }

    .tme-header .nav-drop-btn span {
      color: rgba(243, 245, 247, .5) !important;
    }

    .tme-header .nav-support-link,
    .tme-header .nav-support-link.active {
      min-height: 40px !important;
      padding: .58rem 1rem !important;
      border-radius: 999px !important;
      border: 1px solid rgba(104, 240, 255, .42) !important;
      background: rgba(104, 240, 255, .095) !important;

  <main>

    </div>

        <thead>
          <tr>
            <th>#</th>
            <th>Map UID</th>
            <th>Holder</th>

            <th class="ts">Set</th>
          </tr>
        </thead>

          <tr>
            <td colspan="5" class="skeleton">Loading…</td>
          </tr>
        </tbody>

  <script>
    const WR_LATEST_URL = "/data/wr/latest.json";
    const WR_STATUS_URL = "/data/wr/status.json";
    const PAGE_SIZE = 25;
    const FETCH_LIMIT = 100;

    let allRows = [];
    let page = Number(new URLSearchParams(location.search).get("page")) || 1;

    function fmt(ms) {
      const n = Number(ms);
      if (!Number.isFinite(n)) return "—";
      const m = Math.floor(n / 60000), s = Math.floor((n % 60000) / 1000), x = n % 1000;
      const pad = (v, w = 2) => String(v).padStart(w, "0");
      return `${pad(m)}:${pad(s)}:${String(x).padStart(3, "0")}`;
    }

    function fmtTs(ts) {
      if (ts === null || ts === undefined) return "—";
      const n = Number(ts);
      const ms = Number.isFinite(n) ? (n > 1e12 ? n : n * 1000) : Date.parse(ts);
      return Number.isNaN(ms) ? "—" : new Date(ms).toLocaleString();
    }

    function escapeHTML(s = '') {
      return String(s).replace(/[&<>"']/g, m => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]
      ));
    }

    function playerName(row) {
      return row.displayName || row.player || row.accountId || "—";
    }

    function renderPage(p = 1) {
      const total = allRows.length;
      const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
      page = Math.min(Math.max(1, p), totalPages);

      const start = (page - 1) * PAGE_SIZE;
      const slice = allRows.slice(start, start + PAGE_SIZE);

      const tbody = document.getElementById("rows");
      tbody.innerHTML = "";

      if (!slice.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="skeleton">No WR rows found yet.</td></tr>`;
      } else {
        for (const [i, row] of slice.entries()) {
          const tr = document.createElement("tr");
          tr.innerHTML =
            `<td data-label="#">${start + i + 1}</td>` +
            `<td data-label="Map UID"><span class="truncate">${escapeHTML(row.mapUid || "")}</span></td>` +
            `<td data-label="Holder"><span class="truncate">${escapeHTML(playerName(row))}</span></td>` +
            `<td data-label="WR Time" class="time">${row.timeMs != null ? fmt(row.timeMs) : "—"}</td>` +
            `<td data-label="Set" class="ts">${fmtTs(row.timestamp)}</td>`;
          tbody.appendChild(tr);
        }
      }

      document.getElementById("pageInfo").textContent = `Page ${page} of ${totalPages}`;
      const prev = document.getElementById("prevBtn");
      const next = document.getElementById("nextBtn");
      prev.disabled = page <= 1;
      next.disabled = page >= totalPages;
      prev.onclick = () => goTo(page - 1);
      next.onclick = () => goTo(page + 1);

      const params = new URLSearchParams(location.search);
      params.set("page", page);
      history.replaceState({}, "", `${location.pathname}?${params}`);
    }

    function goTo(p) {
      if (p >= 1) renderPage(p);
    }

    async function load() {
      const tbody = document.getElementById("rows");
      const meta = document.getElementById("meta");

      try {
        tbody.innerHTML = `<tr><td colspan="5" class="skeleton">Loading…</td></tr>`;

        const [latestRes, statusRes] = await Promise.all([
          fetch(`${WR_LATEST_URL}?v=${Date.now()}`, { cache: "no-store" }),
          fetch(`${WR_STATUS_URL}?v=${Date.now()}`, { cache: "no-store" }).catch(() => null),
        ]);

        if (!latestRes.ok) throw new Error(await latestRes.text());
        const latestJson = await latestRes.json();
        const statusJson = statusRes && statusRes.ok ? await statusRes.json() : null;

        const rows = Array.isArray(latestJson.rows) ? latestJson.rows : [];
        allRows = rows.slice(0, FETCH_LIMIT);

        const stamp = Number(latestJson.ts || statusJson?.lastRunAt && Date.parse(statusJson.lastRunAt) || Date.now());
        const ageMs = Math.max(0, Date.now() - stamp);
        const totalRows = Number(statusJson?.rows || rows.length || 0).toLocaleString();
        meta.textContent = `Loaded ${allRows.length.toLocaleString()} recent WRs of ${totalRows} total — updated ${Math.round(ageMs / 1000)}s ago`;

        renderPage(page);
      } catch (e) {
        console.error(e);
        meta.textContent = "Failed to load recent WRs.";
        tbody.innerHTML = `<tr><td colspan="5">Error loading /data/wr/latest.json. Run the WR GitHub Action first.</td></tr>`;
      }
    }

    load();
    setInterval(load, 60 * 60 * 1000);
  </script>


  <script>
    (function () {
      const header = document.querySelector(".tme-header");
      if (!header) return;

      const btn = header.querySelector("#navToggle");
      const nav = header.querySelector("#primary-nav");

      function closeGroups(except) {
        header.querySelectorAll(".nav-group.open").forEach((group) => {
          if (group !== except) group.classList.remove("open");
        });
      }

      header.querySelectorAll(".nav-drop-btn").forEach((dropBtn) => {
        dropBtn.addEventListener("click", (event) => {
          if (window.innerWidth > 900) return;
          event.preventDefault();
          const group = dropBtn.closest(".nav-group");
          if (!group) return;
          const open = !group.classList.contains("open");
          closeGroups(group);
          group.classList.toggle("open", open);
        });
      });

      if (btn && nav && !btn.dataset.tmeHeaderBound) {
        btn.dataset.tmeHeaderBound = "1";

        function setOpen(open) {
          nav.classList.toggle("show", open);
          nav.classList.toggle("open", open);
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          if (!open) closeGroups();
        }

        btn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          setOpen(!nav.classList.contains("show") && !nav.classList.contains("open"));
        });

        nav.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => setOpen(false));
        });

        document.addEventListener("click", (event) => {
          if (!header.contains(event.target)) setOpen(false);
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") setOpen(false);
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth > 900) setOpen(false);
        });
      }

      const accountBtn = header.querySelector("#authMenuAccountBtn");
      const accountMenu = header.querySelector("#authUserMenu");
      const accountToggle = header.querySelector("#authUserBtn");

      accountToggle?.addEventListener("click", () => {
        accountMenu?.classList.toggle("show");
      });

      accountBtn?.addEventListener("click", () => {
        window.location.href = "/account";
      });

      document.addEventListener("click", (event) => {
        if (!event.target.closest(".auth-user-dropdown")) {
          accountMenu?.classList.remove("show");
        }
      });

      header.querySelector("#authMenuLogoutBtn")?.addEventListener("click", async () => {
        const sb =
          window.tmeSupabase ||
          window.supabase ||
          (typeof tmeSupabase !== "undefined" ? tmeSupabase : null);

        try {
          if (sb?.auth?.signOut) await sb.auth.signOut();
        } catch (err) {
          console.warn("Logout failed:", err);
        }

        window.location.href = "/";
      });
    })();
  </script>
