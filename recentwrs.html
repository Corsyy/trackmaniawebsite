<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Recent World Records — Trackmania Events</title>
  <meta name="description" content="Most recent Trackmania world records across all official campaigns, TOTD, and club campaigns."/>
  <meta name="theme-color" content="#0a0f1a"/>
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/logo.png">
  <style>
:root{
  --bg:#0a101a;
  --bg-2:#0d1422;
  --bg-3:#0b1220;

  --panel:#10192a;
  --panel-2:#0d1524;
  --panel-3:#0b1220;

  --text:#eef3ff;
  --muted:#9fb2df;
  --soft:#cfdcff;

  --accent:#4aa3ff;
  --accent-2:#6dfbff;
  --ok:#29d98f;
  --warn:#ffb02e;

  --border:rgba(255,255,255,.07);
  --border-strong:rgba(255,255,255,.12);

  --shadow-sm:0 8px 22px rgba(0,0,0,.20);
  --shadow-md:0 16px 36px rgba(0,0,0,.24);
  --shadow-lg:0 24px 50px rgba(0,0,0,.28);

  --radius:20px;
  --radius-sm:12px;

  --ring:0 0 0 3px rgba(74,163,255,.18);
}

*{box-sizing:border-box}
html,body{height:100%}
html{scroll-behavior:smooth}

body{
  margin:0;
  color:var(--text);
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
  background:#0a101a;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.018;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
  background-size:220px 220px;
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(900px 420px at 50% -220px, rgba(74,163,255,.08), transparent 60%);
  opacity:1;
}

a{color:inherit;text-decoration:none}

.wrap{
  width:min(1220px,92vw);
  margin:0 auto;
  padding:30px 0 80px;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:20px;
  margin-bottom:24px;
}

.title h1{
  margin:0;
  font-size:clamp(2.2rem,4vw,3rem);
  line-height:1.02;
  font-weight:950;
  letter-spacing:-.045em;
  color:#f7faff;
}

.subtitle{
  margin-top:10px;
  color:var(--muted);
  max-width:60ch;
  line-height:1.62;
  font-size:1.04rem;
}

.header-actions{
  display:flex;
  flex-direction:column;
  gap:10px;
  align-items:flex-end;
}

.back a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  min-height:42px;
  padding:.62rem 1rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:#121d31;
  color:var(--text);
  font-weight:850;
  font-size:.92rem;
  line-height:1;
  transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  box-shadow:none;
}

.back a:hover{
  transform:translateY(-1px);
  border-color:var(--border-strong);
  background:#16233a;
  box-shadow:var(--shadow-sm);
}

.back a:focus{
  outline:none;
  box-shadow:var(--ring);
}

.meta{
  color:var(--muted);
  font-size:.92rem;
  line-height:1.45;
}

.grid{
  display:grid;
  gap:1.05rem;
}

.kpis{
  grid-template-columns:repeat(3,1fr);
}

.card{
  border:1px solid var(--border);
  background:linear-gradient(180deg, rgba(16,25,42,.98), rgba(11,18,32,.98));
  border-radius:20px;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-3px);
  border-color:var(--border-strong);
  box-shadow:var(--shadow-md);
}

.card-h{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.02);
}

.card-h .t{
  font-size:.82rem;
  letter-spacing:.06em;
  text-transform:uppercase;
  font-weight:850;
  color:#f4f8ff;
}

.card-b{
  padding:18px;
}

.kpi-label{
  font-size:.82rem;
  color:var(--muted);
  font-weight:700;
  letter-spacing:.02em;
}

.kpi-main{
  font-size:clamp(1.45rem,2.4vw,2rem);
  font-weight:950;
  margin-top:6px;
  letter-spacing:-.03em;
  color:#fff;
}

.kpi-sub{
  margin-top:8px;
  font-size:.92rem;
  color:var(--muted);
  line-height:1.45;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

input,select,button{
  font:inherit;
}

input,select{
  width:100%;
  padding:.75rem .95rem;
  border-radius:12px;
  border:1px solid var(--border);
  background:#0f1829;
  color:var(--text);
}

input::placeholder{
  color:rgba(159,178,223,.72);
}

input:focus,select:focus{
  outline:none;
  border-color:var(--border-strong);
  box-shadow:var(--ring);
}

button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  min-height:42px;
  padding:.62rem 1rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:#121d31;
  color:var(--text);
  font-weight:850;
  font-size:.92rem;
  line-height:1;
  transition:transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease;
  box-shadow:none;
  cursor:pointer;
}

button:hover:not(:disabled){
  transform:translateY(-1px);
  border-color:var(--border-strong);
  background:#16233a;
  box-shadow:var(--shadow-sm);
}

button:focus{
  outline:none;
  box-shadow:var(--ring);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
  box-shadow:none;
}

.help{
  font-size:.85rem;
  color:var(--muted);
}

.table-wrap{
  padding:0;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
}

th{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  text-align:left;
  font-weight:850;
}

td{
  font-size:.95rem;
  color:var(--text);
}

tbody tr{
  transition:background .15s ease;
}

tbody tr:hover{
  background:rgba(74,163,255,.06);
}

.right{
  text-align:right;
}

.time{
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;
}

.rank-cell{
  color:var(--muted);
  width:64px;
  font-weight:800;
}

.player-cell b{
  font-weight:850;
  color:#fff;
}

.truncate{
  display:inline-block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  vertical-align:bottom;
}

.tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.72rem;
  font-weight:850;
  padding:.28rem .58rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:#16233a;
  color:#dff7ff;
  letter-spacing:.02em;
  line-height:1.1;
}

.source-badge{
  text-transform:uppercase;
}

.source-official{
  border-color:rgba(109,251,255,.30);
  color:#dffcff;
  background:rgba(109,251,255,.08);
}

.source-totd{
  border-color:rgba(74,163,255,.35);
  color:#dcebff;
  background:rgba(74,163,255,.10);
}

.source-club{
  border-color:rgba(190,150,255,.28);
  color:#efe1ff;
  background:rgba(190,150,255,.10);
}

.pager{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 18px;
  border-top:1px solid var(--border);
}

.spacer{
  flex:1;
}

.footer{
  margin-top:22px;
  font-size:.9rem;
  color:var(--muted);
  line-height:1.55;
}

.skeleton{
  color:var(--muted);
}

@media (max-width:960px){
  .kpis{
    grid-template-columns:1fr;
  }

  .header{
    flex-direction:column;
    align-items:flex-start;
  }

  .header-actions{
    align-items:flex-start;
  }
}

@media (max-width:900px){
  table,
  tbody,
  tr,
  td{
    display:block;
    width:100%;
  }

  thead{
    display:none;
  }

  tr{
    border:1px solid var(--border);
    border-radius:18px;
    margin:0 12px 12px;
    overflow:hidden;
    background:linear-gradient(180deg, rgba(16,25,42,.98), rgba(11,18,32,.98));
  }

  td{
    display:flex;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--border);
    text-align:right;
  }

  td:last-child{
    border-bottom:none;
  }

  td::before{
    content:attr(data-label);
    color:var(--muted);
    font-size:.8rem;
    font-weight:800;
    text-align:left;
    flex:0 0 100px;
  }

  .truncate{
    max-width:56vw;
  }

  .pager{
    flex-wrap:wrap;
  }
}

@media (max-width:640px){
  .wrap{
    width:min(1220px,94vw);
    padding:22px 0 64px;
  }

  .title h1{
    font-size:2rem;
  }

  .subtitle{
    font-size:.98rem;
  }

  .card-b,
  .card-h{
    padding:14px 16px;
  }

  .pager{
    padding:12px 16px;
  }
}
</style>
  <link rel="dns-prefetch" href="https://trackmaniawebsite.onrender.com">
  <link rel="preconnect" href="https://trackmaniawebsite.onrender.com" crossorigin>
  <link rel="prefetch" href="/wrleaderboard" as="document">
  <link rel="prefetch" href="/recentwrs" as="document">
</head>
<body class="bg-track-curves">
<header>
  <div class="container nav">
    <a class="brand" href="/index"><span class="brand-badge">🏁</span><span>Recent WRs</span></a>
    <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="navlinks" aria-label="Primary">

      <a href="/" class="mobile-only">Home</a>
      <a href="/wrleaderboard" class="mobile-only">WR Leaderboard</a>

      <a href="/kacky">Kacky Finishes</a>
      <a href="/totd">Track of the Day</a>
      <a href="/highlights">Community Highlights</a>
    </nav>
    <div class="cta">
 <a href="/" class="btn">Home</a>
       <a href="/wrleaderboard" class="btn">WR Leaderboard</a>
    </div>
  </div>
</header>
<script>
  (function(){
    const btn = document.getElementById('navToggle');
    const nav = document.getElementById('primary-nav');
    if (!btn || !nav) return;
    btn.addEventListener('click', () => {
      const open = nav.classList.toggle('show');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  })();
</script>
 
<main>
  <h1>Most Recent World Records on TOTD, official campaign and official club campaigns</h1>
  <div id="meta" class="meta">Loading…</div>

  <div class="pager">
    <button id="prevBtn" class="btn">Prev</button>
    <span id="pageInfo" class="meta"></span>
    <button id="nextBtn" class="btn">Next</button>
  </div>

  <div class="card">
    <table class="mobile-stack">
      <thead>
        <tr>
          <th>#</th>
          <th>Map UID</th>
          <th>Holder</th>
          <th class="time">WR Time</th>
          <th class="ts">Set</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="5" class="skeleton">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
const API_BASE = "https://trackmaniawebsite.onrender.com";
const PAGE_SIZE = 25;    // rows per page
const FETCH_LIMIT = 100; // how many records to fetch once

let allRows = [];
let page = Number(new URLSearchParams(location.search).get('page')) || 1;

function fmt(ms){
  if(!Number.isFinite(ms)) return "—";
  const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), x=ms%1000;
  const pad=(n,w=2)=>String(n).padStart(w,"0");
  return `${pad(m)}:${pad(s)}:${String(x).padStart(3,"0")}`;
}
function fmtTs(ts){
  if (ts === null || ts === undefined) return "—";
  const n = Number(ts);
  const ms = Number.isFinite(n) ? (n > 1e12 ? n : n*1000) : Date.parse(ts);
  return isNaN(ms) ? "—" : new Date(ms).toLocaleString();
}

/* ========== NEW: helpers to safely render clickable player links ========== */
function escapeHTML(s=''){
  return s.replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function playerLinkHTML({ id, name }) {
  return escapeHTML(name || id || '—');
}
/* ======================================================================== */

async function resolveNames(ids = []) {
  if (!ids.length) return {};
  try {
    const url = `${API_BASE}/api/debug-names?ids=${encodeURIComponent(ids.join(","))}`;
    const r = await fetch(url);
    if (!r.ok) return {};
    const data = await r.json();
    const arr = Array.isArray(data?.data) ? data.data : [];
    const map = {};
    for (const row of arr) {
      if (row && row.id) map[row.id] = row.name || row.id;
    }
    return map;
  } catch {
    return {};
  }
}

function renderPage(p = 1) {
  const total = allRows.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(Math.max(1, p), totalPages);

  const start = (page - 1) * PAGE_SIZE;
  const slice = allRows.slice(start, start + PAGE_SIZE);

  const $rows = document.getElementById("rows");
  $rows.innerHTML = "";

  slice.forEach((row, i) => {
    const pretty = row.prettyName || row.displayName || row.accountId || "—";
    const tr = document.createElement("tr");
    tr.innerHTML =
      `<td data-label="#">${start + i + 1}</td>` +
      `<td data-label="Map UID"><span class="truncate">${escapeHTML(row.mapUid || '')}</span></td>` +
      `<td data-label="Holder"><span class="truncate">${playerLinkHTML({ id: row.accountId, name: pretty })}</span></td>` +
      `<td data-label="WR Time" class="time">${row.timeMs != null ? fmt(row.timeMs) : "—"}</td>` +
      `<td data-label="Set" class="ts">${fmtTs(row.timestamp)}</td>`;
    $rows.appendChild(tr);
  });

  // pager controls
  document.getElementById("pageInfo").textContent = `Page ${page} of ${totalPages}`;
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  prev.disabled = page <= 1;
  next.disabled = page >= totalPages;
  prev.onclick = () => goTo(page - 1);
  next.onclick = () => goTo(page + 1);

  // keep ?page in URL
  const params = new URLSearchParams(location.search);
  params.set('page', page);
  history.replaceState({}, '', `${location.pathname}?${params}`);
}

function goTo(p){ if (p >= 1) renderPage(p); }

async function load(){
  try {
    document.getElementById("rows").innerHTML = `<tr><td colspan="5" class="skeleton">Loading…</td></tr>`;
    const res = await fetch(`${API_BASE}/api/wr-latest?limit=${FETCH_LIMIT}`, { cache: "no-store" });
    if (!res.ok) throw new Error(await res.text());
    const j = await res.json();
    const rows = Array.isArray(j.rows) ? j.rows : [];

    // collect ids lacking proper names
    const needIds = [...new Set(rows
      .filter(r => r.accountId && (!r.displayName || r.displayName === r.accountId))
      .map(r => r.accountId))];

    const names = await resolveNames(needIds);

    // attach prettyName once
    allRows = rows.map(r => ({ ...r, prettyName: names[r.accountId] || r.displayName || r.accountId }));

    const ago = Math.max(0, Date.now() - (j.fetchedAt || 0));
    document.getElementById("meta").textContent =
      `Fetched ${Math.round(ago/1000)}s ago — ${new Date(j.fetchedAt || Date.now()).toLocaleTimeString()}`;

    renderPage(page);
  } catch (e) {
    console.error(e);
    document.getElementById("meta").textContent = "Failed to load recent WRs.";
    document.getElementById("rows").innerHTML = `<tr><td colspan="5">Error loading data.</td></tr>`;
  }
}

// initial
load();
// optional light auto-refresh
setInterval(() => load(), 60 * 60 * 1000); // once every hour
</script>

<script>
  // keep server warm
  setInterval(() => {
    fetch('https://trackmaniawebsite.onrender.com/api/ping').catch(()=>{});
  }, 5 * 60 * 1000);
  // prefetches
  const prefetch = (url) => {
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    link.as = 'fetch';
    link.crossOrigin = 'anonymous';
    document.head.appendChild(link);
  };
  const wrBtn = document.querySelector('a[href="/wrleaderboard"]');
  const tblBtn = document.querySelector('a[href="/recentwrs"]');
  if (wrBtn) wrBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-players?limit=100'), { once:true });
  if (tblBtn) tblBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-latest?limit=100'), { once:true });
</script>

</body>
</html>
