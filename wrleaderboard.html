  <style>
:root{
--bg:#0a101a;
--panel:#10192a;
--panel-2:#0d1524;

--text:#eef3ff;
--muted:#9fb2df;

--accent:#4aa3ff;
--accent-2:#6dfbff;

--border:rgba(255,255,255,.07);
--border-strong:rgba(255,255,255,.12);

--shadow-sm:0 8px 22px rgba(0,0,0,.25);
--shadow-md:0 16px 36px rgba(0,0,0,.35);

--radius:16px;
}

/* ================= BASE ================= */

*{box-sizing:border-box;margin:0;padding:0}

html,body{height:100%}

body.bg-track-curves{
background:#0a101a;
color:var(--text);
font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}

body.bg-track-curves::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:-1;
opacity:.02;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
background-size:220px 220px;
}

a{color:inherit;text-decoration:none}

/* ================= HEADER ================= */

header{
position:sticky;
top:0;
z-index:50;
background:rgba(10,16,26,.92);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
}

.container{
width:min(1200px,92vw);
margin:0 auto;
display:flex;
justify-content:space-between;
align-items:center;
padding:.9rem 0;
}

.brand{
display:flex;
align-items:center;
gap:.6rem;
font-weight:900;
letter-spacing:-.02em;
}

.brand-badge{
width:34px;
height:34px;
border-radius:10px;
display:grid;
place-items:center;
background:#16233a;
border:1px solid var(--border);
}

/* ================= NAV ================= */

.nav{
display:flex;
align-items:center;
justify-content:space-between;
gap:1rem;
}

.navlinks{
display:flex;
gap:1.2rem;
}

.navlinks a{
color:var(--muted);
white-space:nowrap;
font-weight:600;
opacity:.85;
transition:.2s;
}

.navlinks a:hover{
opacity:1;
color:#fff;
}

.navlinks a.active{
opacity:1;
color:#fff;
position:relative;
}

.navlinks a.active::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:-6px;
height:2px;
background:linear-gradient(90deg,var(--accent),var(--accent-2));
border-radius:2px;
}

.cta{
display:flex;
gap:.6rem;
}

/* ================= BUTTONS ================= */

.btn{
padding:.6rem .95rem;
border:1px solid var(--border);
border-radius:12px;
background:#121d31;
color:var(--text);
font-weight:700;
transition:.18s ease;
}

.btn:hover{
transform:translateY(-1px);
border-color:var(--border-strong);
background:#16233a;
box-shadow:var(--shadow-sm);
}

/* ================= MAIN ================= */

main{
max-width:1100px;
margin:0 auto;
padding:1.5rem;
}

h1{
font-size:1.8rem;
margin-bottom:.4rem;
font-weight:950;
letter-spacing:-.02em;
}

.meta{
color:var(--muted);
font-size:.95rem;
margin-bottom:1rem;
}

/* ================= CONTROLS ================= */

.controls{
display:flex;
gap:.6rem;
align-items:center;
margin-bottom:1rem;
}

.input{
width:280px;
max-width:60vw;
padding:.6rem .8rem;
border-radius:12px;
border:1px solid var(--border);
background:#0f1829;
color:var(--text);
}

/* ================= CARDS ================= */

.card{
border:1px solid var(--border);
background:linear-gradient(180deg, rgba(16,25,42,.98), rgba(11,18,32,.98));
border-radius:var(--radius);
box-shadow:var(--shadow-sm);
padding:1rem;
}

/* ================= PODIUM ================= */

.podium-head{
display:flex;
gap:.6rem;
align-items:center;
justify-content:space-between;
margin:.25rem 0 .8rem;
}

.podium-ctrls{
display:flex;
gap:.5rem;
align-items:center;
}

.podium-list{
display:flex;
gap:.8rem;
flex-wrap:wrap;
}

.podium-item{
flex:1 1 220px;
min-width:220px;
border:1px solid var(--border);
background:#0f1829;
border-radius:14px;
padding:.75rem .9rem;
display:flex;
align-items:center;
gap:.7rem;
}

.podium-medal{
font-size:1.3rem
}

.badge{
border:1px solid var(--border);
padding:.2rem .5rem;
border-radius:999px;
font-size:.85rem;
background:#121d31;
}

/* ================= TABLE ================= */

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:.75rem;
border-bottom:1px solid rgba(255,255,255,.06);
text-align:left;
}

th{
opacity:.9;
font-weight:800;
}

.ts{
opacity:.75;
}

/* ================= PAGER ================= */

.pager{
position:relative;
display:flex;
justify-content:space-between;
align-items:center;
margin:.8rem 0;
}

#pageInfo{
position:absolute;
left:50%;
transform:translateX(-50%);
color:var(--muted);
font-weight:500;
pointer-events:none;
}

/* ================= MOBILE ================= */

.nav-toggle{
display:none;
border:1px solid var(--border);
background:#131e31;
color:var(--text);
border-radius:10px;
padding:.4rem .6rem;
cursor:pointer;
}

.mobile-only{
display:none;
}

@media (max-width:640px){

.nav-toggle{
display:block !important;
}

.cta{
display:none !important;
}

.navlinks{
position:absolute;
top:58px;
left:0;
right:0;
padding:.75rem;
background:rgba(10,16,26,.98);
flex-direction:column;
gap:.8rem;
display:none;
border-bottom:1px solid var(--border);
}

.navlinks.show{
display:flex !important;
}

.mobile-only{
display:block !important;
}

}

<main>
  <h1>Players With The Most World Records on TOTD, official campaigns and official club campaigns</h1>
  <div id="meta" class="meta">Loading…</div>

  <div class="controls">
    <input id="q" class="input" type="search" placeholder="Search player or accountId…">
    <button class="btn" id="clear">Clear</button>
  </div>

  <!-- Monthly Podium Card -->
  <section class="card" style="margin-bottom:1rem;">
    <div class="podium-head">
      <div>
        <strong>Monthly WR Podium</strong>
        <span id="podiumMeta" class="meta" style="margin-left:.4rem; font-size:.9rem"></span>
      </div>
      <div class="podium-ctrls">
        <label for="ym" class="meta">Month:</label>
        <input id="ym" type="month" class="input" style="width:auto; padding:.4rem .6rem">
        <button id="loadPodium" class="btn">Load</button>
      </div>
    </div>
    <div id="podiumList" class="podium-list">
      <div class="meta">Loading podium…</div>
    </div>
  </section>

  <div class="pager">
    <button id="prevBtn" class="btn">Prev</button>
    <span id="pageInfo" class="meta"></span>
    <button id="nextBtn" class="btn">Next</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th>WRs</th>
          <th class="ts">Most Recent</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="4" class="skeleton">Loading…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const API_BASE = "https://trackmaniawebsite.onrender.com";
const PAGE_SIZE = 25;
const FETCH_LIMIT = 100;

let allPlayers = [];
let page = Number(new URLSearchParams(location.search).get('page')) || 1;

function fmtTs(ts){
  if (ts === null || ts === undefined) return "—";
  const n = Number(ts);
  const ms = Number.isFinite(n) ? (n > 1e12 ? n : n*1000) : Date.parse(ts);
  return isNaN(ms) ? "—" : new Date(ms).toLocaleString();
}

/* ===================== New helpers (links & HTML safety) ===================== */
function escapeHTML(s=''){
  return s.replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function playerLinkHTML({ id, name }) {
  return escapeHTML(name || id || '—');
}

/* ============================================================================ */

async function resolveNames(ids = []) {
  if (!ids.length) return {};
  try {
    const url = `${API_BASE}/api/debug-names?ids=${encodeURIComponent(ids.join(","))}`;
    const r = await fetch(url);
    if (!r.ok) return {};
    const data = await r.json();
    const arr = Array.isArray(data?.data) ? data.data : [];
    const map = {};
    for (const row of arr) {
      if (row && row.id) map[row.id] = row.name || row.id;
    }
    return map;
  } catch {
    return {};
  }
}

function renderPage(p=1){
  const total = allPlayers.length;
  const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
  page = Math.min(Math.max(1, p), totalPages);

  const start = (page - 1) * PAGE_SIZE;
  const slice = allPlayers.slice(start, start + PAGE_SIZE);

  const tb = document.getElementById("rows");
  tb.innerHTML = slice.map((pl, i) => `
    <tr>
      <td>${start + i + 1}</td>
      <td>${playerLinkHTML({ id: pl.accountId, name: pl.prettyName || pl.displayName })}</td>
      <td>${pl.wrCount}</td>
      <td class="ts">${fmtTs(pl.latestTs)}</td>
    </tr>
  `).join("");

  document.getElementById("pageInfo").textContent = `Page ${page} of ${totalPages}`;
  const prev = document.getElementById("prevBtn");
  const next = document.getElementById("nextBtn");
  prev.disabled = page <= 1;
  next.disabled = page >= totalPages;
  prev.onclick = () => goTo(page - 1);
  next.onclick = () => goTo(page + 1);

  const params = new URLSearchParams(location.search);
  params.set('page', page);
  history.replaceState({}, '', `${location.pathname}?${params}`);
}

function goTo(p){ if (p >= 1) renderPage(p); }

let fetchCtrl = null;
let debounce = null;

async function load(){
  try{
    if (fetchCtrl) fetchCtrl.abort();
    fetchCtrl = new AbortController();

    document.getElementById("rows").innerHTML = `<tr><td colspan="4" class="skeleton">Loading…</td></tr>`;

    const url = new URL(API_BASE + "/api/wr-players");
    url.searchParams.set("limit", FETCH_LIMIT);
    const q = (document.getElementById("q").value || "").trim();
    if (q) url.searchParams.set("q", q);

    const r = await fetch(url, { signal: fetchCtrl.signal, cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    const j = await r.json();

    const players = Array.isArray(j.players) ? j.players : [];

    const needIds = [...new Set(
      players.filter(p => p.accountId && (!p.displayName || p.displayName === p.accountId))
             .map(p => p.accountId)
    )];

    const names = await resolveNames(needIds);

    allPlayers = players.map(p => ({
      ...p,
      prettyName: names[p.accountId] || p.displayName || p.accountId
    }));

    const ago = Math.max(0, Date.now() - (j.fetchedAt || 0));
    document.getElementById("meta").textContent =
      `Fetched ${Math.round(ago/1000)}s ago — ${new Date(j.fetchedAt || Date.now()).toLocaleTimeString()}`;

    renderPage(page);
  }catch(e){
    if (e.name === "AbortError") return;
    console.error(e);
    document.getElementById("meta").textContent = "Failed to load player leaderboard.";
    document.getElementById("rows").innerHTML = `<tr><td colspan="4">Error loading data.</td></tr>`;
  }
}

document.getElementById("q").addEventListener("input", ()=>{
  clearTimeout(debounce);
  debounce = setTimeout(()=>{ page = 1; load(); }, 250);
});
document.getElementById("clear").onclick = () => { document.getElementById("q").value=""; page=1; load(); };

/* -------- Monthly podium (tries /api/wr-podium, then /api/top-monthly) -------- */
function ymDefaultUTC(){
  const now = new Date();
  const y = now.getUTCFullYear();
  const m = String(now.getUTCMonth()+1).padStart(2,"0");
  return `${y}-${m}`;
}
function fmtNum(n){ try { return Number(n).toLocaleString(); } catch { return String(n); } }

async function fetchJSONWithFallback(ym){
  const try1 = `${API_BASE}/api/wr-podium?month=${encodeURIComponent(ym)}`;
  const try2 = `${API_BASE}/api/top-monthly?ym=${encodeURIComponent(ym)}&limit=3`;

  const one = async (url) => {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  };

  try {
    const j = await one(try1);
    if (Array.isArray(j.top))   return { ym: j.ym || ym,     top: j.top };
    if (Array.isArray(j.podium))return { ym: j.month || ym,  top: j.podium };
    return { ym: j.ym || j.month || ym, top: j.top || j.podium || [] };
  } catch {
    const k = await one(try2);
    return { ym: k.ym || ym, top: Array.isArray(k.top) ? k.top : [] };
  }
}

async function loadPodium(){
  const ym = document.getElementById("ym").value || ymDefaultUTC();
  const list = document.getElementById("podiumList");
  const meta = document.getElementById("podiumMeta");
  list.innerHTML = `<div class="meta">Loading podium…</div>`;
  meta.textContent = "";

  try{
    const { ym: resolvedYm, top } = await fetchJSONWithFallback(ym);

    if (!top.length) {
      list.innerHTML = `<div class="meta">No records yet for ${resolvedYm}.</div>`;
      meta.textContent = "";
      return;
    }

    // ✅ Only show total WRs (no per-source breakdown)
    const medals = ["🥇","🥈","🥉"];
    list.innerHTML = top.slice(0,3).map((p, idx) => `
      <div class="podium-item">
        <div class="podium-medal">${medals[idx] || ""}</div>
        <div style="min-width:0">
          <div style="font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
            ${playerLinkHTML({ id: p.accountId, name: p.displayName })}
          </div>
          <div class="meta" style="font-size:.95rem">
            <span class="badge">${fmtNum(p.wrs ?? p.wrCount ?? 0)} WRs</span>
          </div>
        </div>
      </div>
    `).join("");

    meta.textContent = `Month: ${resolvedYm}`;
  }catch(e){
    console.error(e);
    list.innerHTML = `<div class="meta">Failed to load podium.</div>`;
  }
}

// init podium
(function initPodium(){
  const ymIn = document.getElementById("ym");
  const btn  = document.getElementById("loadPodium");
  if (ymIn) ymIn.value = ymDefaultUTC();
  if (btn) btn.addEventListener("click", loadPodium);
  loadPodium(); // load current month on page load
})();

// initial table load
load();
// occasional refresh
setInterval(() => load(), 60 * 60 * 1000);
</script>

<script>

  setInterval(() => {

  const prefetch = (url) => {
    const link = document.createElement('link');
    link.rel = 'prefetch';
    link.href = url;
    link.as = 'fetch';
    link.crossOrigin = 'anonymous';
    document.head.appendChild(link);
  };
  const wrBtn = document.querySelector('a[href="/wrleaderboard"]');
  const tblBtn = document.querySelector('a[href="/recentwrs"]');
  if (wrBtn) wrBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-players?limit=100'), { once:true });
  if (tblBtn) tblBtn.addEventListener('mouseenter', () => prefetch('https://trackmaniawebsite.onrender.com/api/wr-latest?limit=100'), { once:true });
</script>
