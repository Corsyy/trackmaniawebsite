<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kacky Finishes — Trackmania Events</title>
  <meta name="description" content="Upload and view Trackmania Kacky finish clips. Community submissions, moderated for quality." />
  <style>
    :root{--bg:#0a0f1a;--text:#e6ecff;--muted:#9bb0ff;--accent:#3aa0ff;--accent-2:#6dfbff;--border:rgba(109,251,255,.22);--accent-glow:0 0 24px rgba(61,165,255,.35),0 0 48px rgba(61,165,255,.2)}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    
    body.bg-track-curves{
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(58,160,255,.10), transparent 60%),
        radial-gradient(900px 500px at 110% 10%, rgba(109,251,255,.08), transparent 70%),
        linear-gradient(180deg, #07101c, #0a0f1a 40%, #060a14 100%);
    }
    
    body.bg-track-curves::before{
      content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 800' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%236DAFFF' stop-opacity='.10'/><stop offset='100%' stop-color='%233AE0FF' stop-opacity='.06'/></linearGradient><filter id='blur'><feGaussianBlur stdDeviation='1.4'/></filter></defs><g fill='none' stroke='url(%23g)' stroke-width='2' filter='url(%23blur)'><path d='M-100 700 C300 620 450 480 900 520 C1100 540 1300 620 1400 680'/><path d='M-120 520 C260 460 520 390 940 420 C1180 440 1320 520 1420 600' stroke-width='1.5'/><path d='M-140 350 C220 330 520 300 900 330 C1180 350 1360 420 1500 520' stroke-width='1'/></g></svg>");
      background-size:cover;background-position:center;background-repeat:no-repeat;opacity:.6;mix-blend-mode:screen;
    }
    
    body.bg-track-curves::after{
      content:""; position:fixed; inset:0; pointer-events:none; z-index:-1;
      background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.035'/></svg>");
      background-size:280px 280px; animation:noiseShift 6s steps(2,end) infinite;
    }
    @keyframes noiseShift{50%{transform:translate3d(0,0,0)}50.01%{transform:translate3d(.5px,.5px,0)}}

    
    header{
      background:linear-gradient(180deg, rgba(10,15,26,.92), rgba(10,15,26,.72) 60%, rgba(10,15,26,0));
      backdrop-filter:blur(8px);
      position:sticky; top:0; z-index:50;
      border-bottom:1px solid rgba(109,251,255,.18);
    }
    .nav-container{
      width:min(1200px,92vw); margin:0 auto;
      display:flex; align-items:center; justify-content:space-between; padding:1rem 0;
    }
    .brand{
      font-weight:800; font-size:1.1rem; letter-spacing:.3px; display:flex; align-items:center; gap:.5rem; color:var(--accent-2)
    }
    .btn{
      padding:.6rem .95rem;
      border:1px solid rgba(109,251,255,.25);
      border-radius:12px;
      background:linear-gradient(180deg,rgba(16,24,44,.9),rgba(16,24,44,.6));   color:var(--text);
      font-weight:700;
      transition:.2s;
      text-decoration:none;
    }
    .btn:hover{transform:translateY(-1px) scale(1.02); filter:brightness(1.06)}

    
    .container{width:min(1200px,92vw);margin:0 auto;padding:1.4rem 0 2.2rem}
    h1{font-size:2rem;margin:.2rem 0 1rem;text-shadow:0 0 12px rgba(61,165,255,.25)}
    .hint{font-size:.95rem;color:var(--muted)}

    .thumb-wrap{
  position:relative; width:100%; aspect-ratio:16/9; border-radius:10px; overflow:hidden;
  background:linear-gradient(180deg, rgba(15,21,36,.9), rgba(15,21,36,.6));
  border:1px solid rgba(109,251,255,.18);
}
.thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.play-badge{
  position:absolute; inset:auto auto 10px 10px; padding:.35rem .55rem; border-radius:.5rem;
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); font-weight:800; font-size:.8rem;
}
.thumb-center{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:68px; height:68px; border-radius:999px; border:2px solid rgba(255,255,255,.25);
  display:grid; place-items:center; background:rgba(0,0,0,.35); backdrop-filter:blur(2px);
}
.thumb-center::after{ content:"▶"; font-size:1.4rem; }

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
    .card{
      background:rgba(15,21,36,.55);
      border:1px solid var(--border);
      border-radius:14px; padding:1rem; display:flex; flex-direction:column; gap:.6rem; min-height:180px;
      backdrop-filter:blur(10px) saturate(160%);
      box-shadow:0 10px 30px rgba(0,0,0,.4), 0 0 18px rgba(61,165,255,.18);
      transition:transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .card:hover{transform:translateY(-3px);box-shadow:0 0 18px rgba(61,165,255,.35);filter:brightness(1.03)}
    .card .slot{opacity:.85;font-size:.9rem;color:var(--muted)}
    .badge{display:inline-block;font-size:.75rem;padding:.25rem .5rem;border:1px solid rgba(255,255,255,.2);border-radius:.5rem;background:rgba(255,255,255,.06)}
    .row{display:flex;gap:.6rem;flex-wrap:wrap}

    .btn{padding:.6rem .95rem;border:1px solid rgba(109,251,255,.25);border-radius:12px;background:linear-gradient(180deg,rgba(16,24,44,.9),rgba(16,24,44,.6));color:var(--text);font-weight:700;transition:.2s}
    .btn:hover{transform:translateY(-1px) scale(1.02);filter:brightness(1.06)}

    .btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(109,251,255,.25);box-shadow:none}
    .btn[disabled]{opacity:.55;cursor:not-allowed;transform:none;filter:none}
    .input{
      width:100%;padding:.7rem .9rem;margin:.4rem 0;border-radius:10px;border:1px solid rgba(109,251,255,.25);
      background:#0c1224;color:#e6ecff;outline:none
    }
    .input:focus{border-color:var(--brand);box-shadow:var(--ring)}

    .card iframe{width:100%;height:220px;border:0;border-radius:10px;background:#000}

    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:100;padding:1rem}
    .modal.open{display:flex}
    .modal-card{
      background:rgba(15,21,36,.85);
      border:1px solid rgba(109,251,255,.25);
      border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.6), 0 0 28px rgba(61,165,255,.25);
      width:min(950px,94vw); max-height:90vh; overflow:auto; backdrop-filter:blur(12px) saturate(160%);
    }
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1rem;border-bottom:1px dashed rgba(255,255,255,.12)}
    .modal-body{padding:1rem}
    .player-frame{aspect-ratio:16/9;width:100%;border:0;border-radius:12px;background:#000}

    .title-line{position:relative;display:inline-block}
    .title-line::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  </style>
</head>
<body class="bg-track-curves">
  <header>
    <div class="nav-container">
      <div class="brand">🏎️ Kacky Reloaded 6 finishes</div>
      <div style="display:flex; gap:.5rem;">
        <a href="/" class="btn">Home</a>
        <a href="https://kacky.gg/leaderboard" target="_blank" rel="noopener" class="btn">Kacky Leaderboard</a>
      </div>
    </div>
  </header>

  <div class="container">
    <h1 class="title-line">Kacky Finishes</h1>
    <p class="hint">Upload your kacky finishes, try to keep them in order when you are submitting finishes. If they are not in order it will be denied and you will have to reupload it once again.</p>
    <div id="clipsGrid" class="grid"></div>
  </div>

  <div class="modal" id="submit-modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <strong>Submit Kacky Clip</strong>
        <button class="btn ghost" data-close-submit>Close</button>
      </div>
      <div class="modal-body">
        <form id="submitForm">
          <div class="row">
            <input class="input" name="slot" id="slotField" type="number" min="376" max="450" placeholder="Slot # (376–450)" required />
            <input class="input" name="title" placeholder="Title" required />
          </div>
          <input class="input" name="url" placeholder="Twitch, YouTube, or Streamable URL" required />
          <div class="row">
            <input class="input" name="map" placeholder="Map (optional)" />
            <input class="input" name="thumb" placeholder="Thumbnail URL (optional)" />
          </div>
          <input class="input" name="date" type="datetime-local" />
          <div class="row" style="align-items:center">
            <button class="btn" type="submit">Send</button>
            <span id="submitStatus" class="hint"></span>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal" id="player-modal" aria-hidden="true">
    <div class="modal-card" style="width:min(1280px,96vw)">
      <div class="modal-head">
        <strong>Player</strong>
        <button class="btn ghost" data-close-player>Close</button>
      </div>
      <div class="modal-body">
        <iframe id="playerFrame" class="player-frame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </div>

<script>
  // --- Supabase config ---
  const SUPABASE_URL = "https://lertzsobphopkoyaxrwk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxlcnR6c29icGhvcGtveWF4cndrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA4MjU4MzksImV4cCI6MjA3NjQwMTgzOX0.Vgpdlh8MHG21QIQW10iL1pztUYRPxJXTHMwg0gTPlWI";
  const H = { headers:{ apikey:SUPABASE_ANON_KEY, Authorization:`Bearer ${SUPABASE_ANON_KEY}` } };

  // --- Embed helpers ---
  function twitchParents(){
    const set = new Set(["trackmaniaevents.com","www.trackmaniaevents.com", location.hostname]);
    return [...set].map(p=>`parent=${encodeURIComponent(p)}`).join('&');
  }

  function buildEmbedURL(raw){
    try{
      const u = new URL(raw);
      const host = u.hostname.replace(/^www\./,'');

      // YouTube
      const yid = extractYouTubeId(u);
      if (yid) return `https://www.youtube.com/embed/${encodeURIComponent(yid)}?modestbranding=1&rel=0&playsinline=1`;

      // Twitch CLIP ONLY
      if (host === 'clips.twitch.tv') {
        const slug = u.pathname.split('/').filter(Boolean)[0];
        if (slug) return `https://clips.twitch.tv/embed?clip=${encodeURIComponent(slug)}&${twitchParents()}&autoplay=false`;
      }

      // Streamable
      if (host === 'streamable.com') {
        const parts = u.pathname.split('/').filter(Boolean);
        const id = (parts[0] === 'e' || parts[0] === 'o') ? parts[1] : parts[0];
        if (id) return `https://streamable.com/e/${encodeURIComponent(id)}`;
      }

      return raw;
    }catch(e){ return raw; }
  }

  // ---- Robust YouTube ID extractor ----
  function extractYouTubeId(u){
    try{
      const host = u.hostname.replace(/^www\./,'');
      const path = u.pathname;
      const qs = u.searchParams;

      if ((host === 'youtube.com' || host === 'm.youtube.com' || host === 'music.youtube.com') && qs.get('v')) return qs.get('v');
      if (host === 'youtu.be') {
        const id = (path || '').slice(1).split('/')[0];
        if (id) return id;
      }
      const shorts = path.match(/\/shorts\/([a-zA-Z0-9_-]{6,})/);
      if (shorts) return shorts[1];
      const live = path.match(/\/live\/([a-zA-Z0-9_-]{6,})/);
      if (live) return live[1];
      const embed = path.match(/\/embed\/([a-zA-Z0-9_-]{6,})/);
      if (embed) return embed[1];

      const m = u.href.match(/(?:(?:v=|\/)([a-zA-Z0-9_-]{11}))(?:[&?/]|$)/);
      if (m) return m[1];
    }catch(e){}
    return null;
  }

  // --- Thumbnail helpers ---
  // Synchronous (no network): YT + Streamable
  function buildPreviewURLSync(raw){
    try{
      const u = new URL(raw);
      const host = u.hostname.replace(/^www\./,'');
      const yid = extractYouTubeId(u);
      if (yid) return `https://i.ytimg.com/vi/${encodeURIComponent(yid)}/hqdefault.jpg`;

      if (host === 'streamable.com') {
        const parts = u.pathname.split('/').filter(Boolean);
        const id = parts[0] === 'e' || parts[0] === 'o' ? parts[1] : parts[0];
        if (id) return `https://cdn-cf-east.streamable.com/image/${encodeURIComponent(id)}.jpg`;
      }
    }catch(e){}
    return null; // Twitch clips handled async
  }

  // Normalize Twitch {width}x{height} thumbnail URLs
 // --- helpers ---
function normalizeTwitchThumb(u){
  if (!u) return u;
  // protocol-relative -> https
  if (u.startsWith('//')) u = 'https:' + u;
  // replace Twitch template tokens
  u = u.replace(/%7Bwidth%7D|\{width\}/gi, '640')
       .replace(/%7Bheight%7D|\{height\}/gi, '360');
  // ensure a sane width hint
  if (/twitch|ttvthumb/i.test(u) && !/[?&]imwidth=\d+/.test(u)) {
    u += (u.includes('?') ? '&' : '?') + 'imwidth=640';
  }
  return u;
}

// Prefer oEmbed for clips.twitch.tv, then fallback to OG scraping via r.jina.ai
async function fetchTwitchThumb(raw){
  try{
    const u = new URL(raw);
    const host = u.hostname.replace(/^www\./,'');
    if (host !== 'clips.twitch.tv') return null;

    // 1) oEmbed (most reliable, CORS-friendly)
    // https://clips.twitch.tv/oembed?url=<clipUrl>
    const oe = await fetch(`https://clips.twitch.tv/oembed?url=${encodeURIComponent(raw)}`);
    if (oe.ok){
      const j = await oe.json();
      if (j.thumbnail_url) return normalizeTwitchThumb(j.thumbnail_url);
    }

    // 2) Fallback: scrape OG/Twitter image through read-only proxy
    const scheme = u.protocol.replace(':','').toLowerCase();
    const proxied = `https://r.jina.ai/${scheme}://${u.host}${u.pathname}${u.search}`;
    const res = await fetch(proxied, { method:'GET' });
    if (!res.ok) return null;
    const html = await res.text();

    let m = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i);
    if (m && m[1]) return normalizeTwitchThumb(m[1]);
    m = html.match(/<meta[^>]+name=["']twitter:image["'][^>]+content=["']([^"']+)["']/i);
    if (m && m[1]) return normalizeTwitchThumb(m[1]);
    m = html.match(/"thumbnailUrl"\s*:\s*\[\s*"([^"]+)"\s*\]/i);
    if (m && m[1]) return normalizeTwitchThumb(m[1]);
  }catch(e){}
  return null;
}

// Resolve a preview URL for anything we couldn't do synchronously
async function fetchPreviewURL(raw){
  try{
    const u = new URL(raw);
    const host = u.hostname.replace(/^www\./,'');

    // YouTube
    if (host.includes('youtube') || host === 'youtu.be'){
      const r = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(raw)}&format=json`);
      if (r.ok){ const j = await r.json(); if (j.thumbnail_url) return j.thumbnail_url; }
    }

    // Twitch CLIPS
    if (host === 'clips.twitch.tv'){
      const t = await fetchTwitchThumb(raw);
      if (t) return t;
    }

    // Streamable
    if (host === 'streamable.com'){
      const r = await fetch(`https://api.streamable.com/oembed.json?url=${encodeURIComponent(raw)}`);
      if (r.ok){ const j = await r.json(); if (j.thumbnail_url) return j.thumbnail_url; }
    }
  }catch(e){}
  return null;
}


  function platformLabel(raw){
    try{
      const h = new URL(raw).hostname.replace(/^www\./,'');
      if (h.includes('youtu')) return 'YouTube';
      if (h.includes('twitch')) return 'Twitch';
      if (h.includes('streamable')) return 'Streamable';
    }catch(e){}
    return 'Video';
  }

  // --- Data load ---
  async function loadClips(){
    try{
      const [approvedRes, allRes] = await Promise.all([
        fetch(`${SUPABASE_URL}/rest/v1/kacky_clips?approved=eq.true&select=id,slot,title,url,map,date,thumb`, H),
        fetch(`${SUPABASE_URL}/rest/v1/kacky_clips?select=slot`, H)
      ]);
      const approved = await approvedRes.json();
      const all = await allRes.json();
      const occupied = new Set(all.map(r => Number(r.slot)));
      render(approved, occupied);
      hydrateThumbnails(); // async fill-ins (Twitch clips)
    }catch(err){
      console.error(err);
      document.getElementById('clipsGrid').innerHTML = '<p>Failed to load clips.</p>';
    }
  }

  // --- Render grid with thumbnails (no iframes here) ---
  function render(clips, occupied){
    const grid = document.getElementById('clipsGrid');
    grid.innerHTML = '';
    for(let i=376;i<=450;i++){
      const clip = clips.find(c => Number(c.slot)===i);
      const isOccupied = occupied.has(i);
      const card = document.createElement('div');
      card.className = 'card';

      if(clip){
        const embed = buildEmbedURL(clip.url);
        const title = escapeHtml(clip.title||'Kacky Finish');
        const mapTxt = clip.map ? ` · ${escapeHtml(clip.map)}` : '';
        const plat = platformLabel(clip.url);

        const syncThumb = clip.thumb || buildPreviewURLSync(clip.url);
        const needsAsync = !syncThumb;

        card.innerHTML = `
          <div class="slot">Slot ${i}${mapTxt}</div>
          <strong>${title}</strong>

          <button class="thumb-wrap openPlayer" data-url="${encodeURIComponent(embed)}" aria-label="Play ${title}"
                  ${needsAsync ? `data-thumb-src-needed="1" data-raw-url="${encodeURIComponent(clip.url)}"` : ''}>
            ${syncThumb ? `<img src="${syncThumb}" alt="${title}" loading="lazy">`
                        : `<div style="width:100%;height:100%;display:grid;place-items:center;opacity:.7">Loading preview…</div>`}
            <div class="thumb-center"></div>
            <span class="play-badge">${plat}</span>
          </button>

          <div class="row">
            <button class='btn openPlayer' data-url='${encodeURIComponent(embed)}'>View / Fullscreen</button>
          </div>
        `;
      } else if(isOccupied){
        card.innerHTML = `
          <div class="slot">Slot ${i}</div>
          <em>Submission pending review</em>
          <div class="row">
            <button class='btn' disabled>Upload disabled</button>
            <span class="badge">1 per slot</span>
          </div>`;
      } else {
        card.innerHTML = `
          <div class="slot">Slot ${i}</div>
          <em>No clip yet</em>
          <div class="row">
            <button class='btn upload' data-slot='${i}'>Upload for Slot ${i}</button>
          </div>`;
      }
      grid.appendChild(card);
    }
  }

  // After render, fetch thumbnails we couldn’t derive synchronously (Twitch clips etc.)
  async function hydrateThumbnails(){
    const wraps = [...document.querySelectorAll('.thumb-wrap[data-thumb-src-needed="1"]')];
    if (!wraps.length) return;

    await Promise.all(wraps.map(async wrap => {
      const rawEncoded = wrap.getAttribute('data-raw-url');
      const raw = rawEncoded ? decodeURIComponent(rawEncoded) : null;
      if (!raw) return;

      const imgUrl = await fetchPreviewURL(raw);
      if (imgUrl) {
        wrap.querySelectorAll('div').forEach(d => { if (d.textContent?.includes('Loading preview')) d.remove(); });
        const img = document.createElement('img');
        img.alt = 'Clip preview';
        img.loading = 'lazy';
        img.src = imgUrl;
        wrap.prepend(img);
      }
      wrap.removeAttribute('data-thumb-src-needed');
      wrap.removeAttribute('data-raw-url');
    }));
  }

  // --- Utils ---
  function escapeHtml(s){
    return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
  }

  // --- Modals / player wiring ---
  const submitModal = document.getElementById('submit-modal');
  const playerModal = document.getElementById('player-modal');
  const slotField = document.getElementById('slotField');
  const playerFrame = document.getElementById('playerFrame');

  function openSubmit(slot){ if(slot){ slotField.value = slot; } submitModal.classList.add('open'); submitModal.setAttribute('aria-hidden','false'); }
  function closeSubmit(){ submitModal.classList.remove('open'); submitModal.setAttribute('aria-hidden','true'); }

  function openPlayer(url){
    try{
      const u = new URL(decodeURIComponent(url));
      if (u.host.includes('youtube.com')) {
        u.searchParams.set('autoplay','1'); u.searchParams.set('playsinline','1'); url = u.toString();
      } else if (u.host.includes('twitch.tv')) {
        u.searchParams.set('autoplay','true'); url = u.toString();
      } else if (u.host.includes('streamable.com')) {
        if (!u.searchParams.has('autoplay')) u.searchParams.set('autoplay','1'); url = u.toString();
      }
    }catch(e){}

    playerFrame.src = url;
    playerModal.classList.add('open');
    playerModal.setAttribute('aria-hidden','false');
  }

  function closePlayer(){ playerFrame.src = ''; playerModal.classList.remove('open'); playerModal.setAttribute('aria-hidden','true'); }

  document.addEventListener('click', (e)=>{
    const t = e.target;

    const openBtn = t.closest?.('.openPlayer');
    if (openBtn) {
      const url = openBtn.getAttribute('data-url');
      if (url) openPlayer(url);
      return;
    }

    if(t.matches('.upload')){ const slot = t.getAttribute('data-slot'); openSubmit(slot); return; }
    if(t.matches('[data-close-submit]')) { closeSubmit(); return; }
    if(t.matches('[data-close-player]')) { closePlayer(); return; }

    if(t.classList.contains('modal')){
      if(t.id==='submit-modal') closeSubmit();
      if(t.id==='player-modal') closePlayer();
    }
  });

  // --- Submit flow ---
  (function(){
    const form=document.getElementById('submitForm');
    const status=document.getElementById('submitStatus');

    // Allow: YouTube, Streamable, Twitch CLIPS only
    function isValidClipUrl(u){
      try{
        const h=new URL(u).hostname.replace(/^www\./,'');
        if (/youtube\.com|youtu\.be|streamable\.com/i.test(h)) return true;
        if (h === 'clips.twitch.tv') return true;
        return false;
      } catch { return false; }
    }

    function clampSlot(n){ n=Number(n||0); return Math.min(450, Math.max(376, n)); }

    form?.addEventListener('submit', async e => {
      e.preventDefault();
      status.textContent='Checking slot…';

      const fd = new FormData(form);
      const dateRaw = (fd.get('date')||'').toString().trim();
      const payload = {
        title: (fd.get('title')||'').toString().trim(),
        url:   (fd.get('url')||'').toString().trim(),
        slot:  clampSlot(fd.get('slot')),
        map:   (fd.get('map')||'').toString().trim() || null,
        thumb: (fd.get('thumb')||'').toString().trim() || null,
        date:  dateRaw ? new Date(dateRaw).toISOString() : null,
        approved: false
      };

      if(!isValidClipUrl(payload.url)){
        status.textContent='Please enter a YouTube, Streamable, or Twitch *clip* URL (clips.twitch.tv).';
        return;
      }

      try{
        const existsRes = await fetch(`${SUPABASE_URL}/rest/v1/kacky_clips?slot=eq.${encodeURIComponent(payload.slot)}&select=slot`, H);
        const exists = await existsRes.json();
        if(Array.isArray(exists) && exists.length){
          status.textContent='❌ This slot already has a submission.';
          return;
        }
      }catch{}

      status.textContent='Sending…';
      try{
        const res = await fetch(`${SUPABASE_URL}/rest/v1/kacky_clips`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...H.headers, Prefer:'return=minimal' },
          body: JSON.stringify(payload)
        });

        if(!res.ok){
          const txt = await res.text();
          if(res.status===409){ status.textContent='❌ Slot already taken.'; return; }
          status.textContent = `⚠️ ${res.status} ${txt || 'Submission failed'}`;
          console.error('Supabase insert error:', res.status, txt);
          return;
        }

        status.textContent='✅ Submitted! Awaiting approval.';
        form.reset();
        setTimeout(()=>{ closeSubmit(); status.textContent=''; loadClips(); }, 1000);
      }catch(err){
        console.error(err);
        status.textContent='⚠️ Network error. Please try again later.';
      }
    });
  })();

  // Initial load
  loadClips();
</script>

</body>
