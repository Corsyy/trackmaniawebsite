<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="shortcut icon" href="/logo.png">
<title>Track of the Day</title>

<style>
:root{
  --bg:#0a0f1a;
  --bg-2:#0d1526;
  --panel:#10192b;
  --panel-2:#0d1424;
  --text:#e6ecff;
  --muted:#9bb0ff;
  --accent:#3aa0ff;
  --accent-2:#6dfbff;
  --border:rgba(109,251,255,.16);
  --border-strong:rgba(109,251,255,.24);
  --shadow:0 10px 28px rgba(0,0,0,.28);
  --ring:0 0 0 3px rgba(61,165,255,.18);
  --radius:16px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
  color:var(--text);
  background:#08101c;
}
a{color:inherit;text-decoration:none}

.container{
  width:min(1180px,92vw);
  margin:0 auto;
  padding:1rem;
}

body.bg-track-curves{
  background:
    linear-gradient(180deg, #07101c 0%, #0a0f1a 42%, #060a14 100%);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

body.bg-track-curves::after{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-1;
  opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
  background-size:220px 220px;
}

/* ---------- HEADER ---------- */

header{
  position:sticky;
  top:0;
  z-index:20;
  background:transparent;
  backdrop-filter:none;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  padding:.9rem 0 .55rem;
}

h1{
  margin:0;
  font-size:1.6rem;
  font-weight:900;
  letter-spacing:.2px;
  color:#f3f7ff;
}

.navlinks{
  display:flex;
  gap:1.25rem;
}

.navlinks a{
  color:var(--muted);
  white-space:nowrap;
  font-weight:600;
  opacity:.84;
  transition:color .18s ease, opacity .18s ease;
}

.navlinks a:hover{
  opacity:1;
  color:#dff7ff;
}

.navlinks a.active{
  opacity:1;
  color:#dff7ff;
  position:relative;
}

.navlinks a.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-6px;
  height:2px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));
  border-radius:2px;
}

.cta{
  display:flex;
  gap:.6rem;
}

.nav-toggle{
  display:none;
  border:1px solid var(--border);
  background:rgba(16,24,44,.88);
  color:var(--text);
  border-radius:10px;
  padding:.45rem .65rem;
  cursor:pointer;
}

/* ---------- CONTROLS ---------- */

.month-row{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:.6rem;
  padding:0 1rem .75rem;
  font-size:.95rem;
  color:var(--muted);
}

.select{
  display:flex;
  align-items:center;
  gap:.55rem;
}

select{
  background:#0c1322;
  border:1px solid var(--border);
  color:var(--text);
  padding:.5rem .75rem;
  border-radius:10px;
  font-weight:600;
  outline:none;
}

select:focus{
  box-shadow:var(--ring);
  border-color:var(--border-strong);
}

/* ---------- BUTTONS ---------- */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:.45rem;
  min-height:40px;
  padding:.58rem .9rem;
  border:1px solid var(--border);
  border-radius:12px;
  background:rgba(16,24,44,.88);
  color:var(--text);
  font-weight:800;
  line-height:1;
  transition:transform .16s ease, border-color .16s ease, background .16s ease;
}

.btn:hover{
  transform:translateY(-1px);
  border-color:var(--border-strong);
  background:rgba(20,30,54,.94);
}

.btn.ghost{
  background:transparent;
}

.btn:focus-visible{
  outline:none;
  box-shadow:var(--ring);
}

/* ---------- HERO ---------- */

.hero{
  display:grid;
  grid-template-columns:minmax(280px, 460px) minmax(260px, 1fr);
  gap:1.1rem;
  margin:1rem 0 1.15rem;
  align-items:stretch;
}

.hero .thumb{
  width:100%;
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border);
  background:#08101c;
  box-shadow:var(--shadow);
}

.hero-panel{
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  gap:.7rem;
  min-width:0;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(180deg, rgba(16,25,43,.94), rgba(11,17,31,.94));
  padding:1rem 1rem 1.05rem;
  box-shadow:var(--shadow);
}

.hero h2{
  margin:0;
  font-size:clamp(1.5rem,2.8vw,2rem);
  line-height:1.08;
}

.hero-meta{
  display:flex;
  flex-direction:column;
  gap:.45rem;
}

.hero-row{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.55rem;
}

.hero-label{
  color:var(--muted);
  font-weight:700;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:.6rem;
  margin-top:.15rem;
}

/* ---------- CARDS ---------- */

.card{
  display:flex;
  flex-direction:column;
  min-height:100%;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:linear-gradient(180deg, rgba(13,21,37,.96), rgba(9,15,28,.96));
  box-shadow:var(--shadow);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:var(--border-strong);
  box-shadow:0 14px 30px rgba(0,0,0,.34);
}

.thumb{
  aspect-ratio:16/9;
  background:#08101c;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.meta{
  padding:.95rem .95rem 1rem;
  display:flex;
  flex-direction:column;
  flex:1;
  gap:.45rem;
  min-width:0;
}

.date{
  font-size:.9rem;
  color:var(--muted);
  line-height:1.2;
}

.card-title{
  margin:0;
  font-size:1.06rem;
  line-height:1.25;
  font-weight:900;
  letter-spacing:.05px;
  color:#f3f7ff;
  word-break:break-word;
}

.byline{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.45rem;
  color:#dbe6ff;
  line-height:1.3;
}

.byline-label{
  color:var(--text);
  font-weight:700;
}

.badge{
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  max-width:100%;
  border:1px solid var(--border);
  padding:.28rem .58rem;
  border-radius:999px;
  font-size:.84rem;
  background:rgba(109,251,255,.08);
  color:#d8e8ff;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ---------- MEDALS ---------- */

.medals{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:.45rem;
  margin-top:.1rem;
}

.medal{
  display:inline-flex;
  align-items:center;
  gap:.38rem;
  min-height:28px;
  padding:.22rem .48rem;
  border-radius:999px;
  border:1px solid var(--border);
  background:rgba(15,21,36,.7);
  font-size:.82rem;
  line-height:1;
  color:#edf3ff;
}

.medal .medal-icon{
  width:16px;
  height:16px;
  object-fit:contain;
  flex:0 0 auto;
}

.medal.author{
  border-color:rgba(255,154,59,.35);
  background:rgba(255,206,106,.08);
}

.mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  letter-spacing:.02em;
}

/* ---------- CARD FOOTER ---------- */

.meta-footer{
  margin-top:auto;
  padding-top:.25rem;
  display:flex;
  flex-wrap:wrap;
  gap:.55rem;
}

.meta-footer .btn{
  flex:0 0 auto;
}

/* ---------- GRID ---------- */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1rem;
  align-items:stretch;
}

/* ---------- MOBILE ---------- */

@media (max-width: 820px){
  .hero{
    grid-template-columns:1fr;
  }
}

@media (max-width: 640px){
  .nav-toggle{display:block}

  .navlinks{
    display:none;
    position:absolute;
    top:58px;
    left:0;
    right:0;
    padding:.8rem 1rem 1rem;
    background:rgba(10,15,26,.97);
    backdrop-filter:blur(8px);
    flex-direction:column;
    gap:.7rem;
  }

  .navlinks.show{display:flex}

  .cta{display:none}

  .container{
    width:min(100%,94vw);
  }

  .grid{
    grid-template-columns:1fr;
  }

  .meta-footer .btn{
    width:100%;
  }
}
</style>
</head>

<body class="bg-track-curves">
<header>
  <div class="container nav">
    <h1>Track of the Day</h1>
    <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="navlinks" aria-label="Primary">
      <a href="/kacky">Kacky Finishes</a>
      <a href="/recentwrs">Recent WRs</a>
      <a href="/highlights">Community Highlights</a>
    </nav>
    <div class="cta">
      <a href="/" class="btn">Home</a>
    </div>
  </div>

  <div class="container month-row">
    <div class="select">
      <span>Month:</span>
      <select id="month"></select>
    </div>
  </div>
</header>

<script>
(function(){
  const btn = document.getElementById('navToggle');
  const nav = document.getElementById('primary-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', () => {
    const open = nav.classList.toggle('show');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>

<main class="container">
  <section id="today" class="hero">
    <div class="thumb" id="t-thumb"></div>

    <div class="hero-panel">
      <h2 id="t-name">(loading…)</h2>

      <div class="hero-meta">
        <div class="hero-row">
          <span class="hero-label">Author:</span>
          <span class="badge" id="t-author">—</span>
        </div>

        <p id="t-date" class="date"></p>

        <div id="t-medals"></div>

        <div class="actions" id="t-actions"></div>
      </div>
    </div>
  </section>

  <section class="grid" id="grid"></section>
</main>

<script>
(function(){
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const bust=()=>`?t=${Date.now()}`;

  const jget = async (url)=>{
    const r = await fetch(url+bust(), { cache:"no-store" });
    if(!r.ok) throw new Error(`${url} -> ${r.status}`);
    return r.json();
  };

  const set=(id,html)=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=html;
  };

  const setText=(id,txt)=>{
    const el=document.getElementById(id);
    if(el) el.textContent=txt ?? "";
  };

  function fmtMs(ms){
    if(ms==null) return null;
    const t=Math.max(0,Number(ms)|0);
    const m=Math.floor(t/60000);
    const s=Math.floor((t%60000)/1000);
    const ms3=(t%1000).toString().padStart(3,"0");
    return `${m}:${s.toString().padStart(2,"0")}.${ms3}`;
  }

  function authorMedal(msVal){
    if (msVal == null || Number(msVal) <= 0) return "";
    return `
      <span class="medal author">
        <img class="medal-icon" src="/img/author.png" alt="Author Medal" loading="lazy">
        <b>AT</b>
        <span class="mono">${fmtMs(msVal)}</span>
      </span>
    `;
  }

  function buildMedals(map){
    if(!map) return "";
    const at = authorMedal(map.authorTime);
    return at ? `<div class="medals">${at}</div>` : "";
  }

  const button = (label, href, extra='') =>
    `<a class="btn" href="${href}" target="_blank" rel="noopener" ${extra}>${label}</a>`;

  function actionsFromMap(map){
    const acts=[];
    if(map?.downloadUrl) acts.push(button("⬇️ Download", map.downloadUrl));
    if(map?.uid) acts.push(`<button class="btn ghost" data-copy-uid="${map.uid}">Copy UID</button>`);
    return acts.join("");
  }

  function renderHero(rec){
    if(!rec) return;
    const m = rec.map || {};

    set("t-thumb",
      m.thumbnailUrl
        ? `<img src="${m.thumbnailUrl}" referrerpolicy="no-referrer" alt="Map thumbnail">`
        : `<div class="thumb" style="display:grid;place-items:center;color:var(--muted)">No image</div>`
    );

    setText("t-name", m.name || "(unknown map)");
    setText("t-author", m.authorDisplayName || "—");
    setText("t-date", rec.date || "");
    set("t-medals", buildMedals(m));
    set("t-actions", actionsFromMap(m));
  }

  function renderGrid(days){
    const grid=document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML="";

    const keys=Object.keys(days).sort();
    for(const k of keys){
      const d=days[k];
      const m=d.map || {};

      const card=document.createElement("article");
      card.className="card";
      card.innerHTML=`
        <div class="thumb">
          ${m.thumbnailUrl ? `<img loading="lazy" referrerpolicy="no-referrer" src="${m.thumbnailUrl}" alt="">` : ""}
        </div>
        <div class="meta">
          <div class="date">${d.date}</div>
          <h3 class="card-title">${m.name || "(unknown map)"}</h3>

          <div class="byline">
            <span class="byline-label">Author:</span>
            <span class="badge">${m.authorDisplayName || "—"}</span>
          </div>

          ${buildMedals(m)}

          <div class="meta-footer">
            ${m.downloadUrl ? `<a class="btn" href="${m.downloadUrl}" target="_blank" rel="noopener">⬇️ Download</a>` : ""}
            ${m.uid ? `<button class="btn ghost" data-copy-uid="${m.uid}">Copy UID</button>` : ""}
          </div>
        </div>`;
      grid.appendChild(card);
    }
  }

  async function loadMonth(ym){
    const month = await jget(`data/totd/${ym}.json`);
    const latest = month.days[Object.keys(month.days).sort().pop()];
    renderHero(latest);
    renderGrid(month.days);
  }

  async function init(){
    const sel=document.getElementById("month");
    const monthsJ=await jget("/data/totd/months.json");
    const months=(monthsJ?.months||[]).slice().sort().reverse();

    if(!months.length){
      if(sel) sel.innerHTML=`<option>(no data yet)</option>`;
      return;
    }

    if(sel){
      sel.innerHTML=months.map(k=>{
        const [y,mm]=k.split("-");
        return `<option value="${k}">${MONTHS[+mm-1]} ${y}</option>`;
      }).join("");

      sel.value=months[0];
      sel.onchange=()=>loadMonth(sel.value);
    }

    await loadMonth(months[0]);
  }

  document.addEventListener("click",(e)=>{
    const t=e.target;
    if(t && t.matches("[data-copy-uid]")){
      const uid=t.getAttribute("data-copy-uid");
      if(uid){
        navigator.clipboard?.writeText(uid).then(()=>{
          t.textContent="Copied!";
          setTimeout(()=>t.textContent="Copy UID",1200);
        }).catch(()=>{
          t.textContent="Copy failed";
          setTimeout(()=>t.textContent="Copy UID",1200);
        });
      }
    }
  });

  init().catch(err=>{
    console.error("[TOTD] init failed:",err);
    const n=document.getElementById("t-name");
    if(n) n.textContent="(failed to load)";
  });
})();
</script>
</body>
</html>
