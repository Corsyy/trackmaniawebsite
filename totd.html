<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="shortcut icon" href="/logo.png">
<title>Track of the Day</title>

<style>
:root{
  --bg:#0b111c;
  --bg-2:#0f1728;
  --panel:#121c30;
  --panel-2:#0e1626;

  --text:#e8eeff;
  --muted:#9fb3ff;

  --accent:#4aa3ff;
  --accent-2:#6dfbff;

  --border:rgba(255,255,255,.06);
  --border-strong:rgba(255,255,255,.12);

  --radius:14px;
}

/* ---------- GLOBAL ---------- */

*{box-sizing:border-box}
html,body{height:100%}

body{
  margin:0;
  font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
  color:var(--text);
  background:#0b111c;
}

a{color:inherit;text-decoration:none}

.container{
  width:min(1180px,92vw);
  margin:auto;
  padding:1rem;
}

/* ---------- HEADER ---------- */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:#0b111c;
}

.nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.9rem 0;
}

h1{
  margin:0;
  font-size:1.5rem;
  font-weight:900;
}

.navlinks{
  display:flex;
  gap:1.2rem;
}

.navlinks a{
  color:var(--muted);
  font-weight:600;
  opacity:.9;
}

.navlinks a:hover{
  color:white;
}

.navlinks a.active{
  color:white;
  position:relative;
}

.navlinks a.active::after{
  content:"";
  position:absolute;
  bottom:-6px;
  left:0;
  right:0;
  height:2px;
  background:var(--accent);
}

/* ---------- CONTROLS ---------- */

.month-row{
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.3rem 0 .9rem;
  color:var(--muted);
}

select{
  background:#111a2c;
  border:1px solid var(--border);
  color:var(--text);
  padding:.45rem .7rem;
  border-radius:8px;
}

/* ---------- BUTTONS ---------- */

.btn{
  display:inline-flex;
  align-items:center;
  gap:.4rem;
  padding:.55rem .85rem;
  border-radius:10px;
  border:1px solid var(--border);
  background:#121c30;
  font-weight:700;
  font-size:.9rem;
}

.btn:hover{
  border-color:var(--border-strong);
}

.btn.ghost{
  background:transparent;
}

/* ---------- HERO ---------- */

.hero{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:1rem;
  margin:1rem 0 1.2rem;
}

.hero .thumb{
  border-radius:var(--radius);
  overflow:hidden;
  border:1px solid var(--border);
}

.hero-panel{
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel);
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:.6rem;
}

.hero h2{
  margin:0;
  font-size:1.6rem;
}

.hero-meta{
  display:flex;
  flex-direction:column;
  gap:.4rem;
}

.hero-row{
  display:flex;
  align-items:center;
  gap:.4rem;
}

.hero-label{
  color:var(--muted);
}

.actions{
  display:flex;
  gap:.5rem;
  margin-top:.3rem;
}

/* ---------- GRID ---------- */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1rem;
}

/* ---------- CARDS ---------- */

.card{
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  transition:transform .15s ease;
}

.card:hover{
  transform:translateY(-3px);
}

.thumb{
  aspect-ratio:16/9;
  background:#0b111c;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ---------- CARD BODY ---------- */

.meta{
  padding:.9rem;
  display:flex;
  flex-direction:column;
  gap:.4rem;
  flex:1;
}

.date{
  font-size:.85rem;
  color:var(--muted);
}

.card-title{
  margin:0;
  font-size:1.05rem;
  font-weight:900;
}

.byline{
  display:flex;
  align-items:center;
  gap:.4rem;
}

.byline-label{
  color:var(--muted);
}

.badge{
  background:#18233a;
  border:1px solid var(--border);
  border-radius:999px;
  padding:.25rem .55rem;
  font-size:.8rem;
}

/* ---------- MEDALS ---------- */

.medals{
  display:flex;
  gap:.4rem;
  margin-top:.2rem;
}

.medal{
  display:inline-flex;
  align-items:center;
  gap:.3rem;
  border-radius:999px;
  border:1px solid var(--border);
  padding:.2rem .45rem;
  font-size:.8rem;
}

.medal-icon{
  width:16px;
  height:16px;
}

/* ---------- CARD FOOTER ---------- */

.meta-footer{
  margin-top:auto;
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
}

/* ---------- MOBILE ---------- */

@media(max-width:820px){
  .hero{
    grid-template-columns:1fr;
  }
}

@media(max-width:640px){

  .grid{
    grid-template-columns:1fr;
  }

  .meta-footer .btn{
    width:100%;
  }

}
</style>
</head>

<body class="bg-track-curves">
<header>
  <div class="container nav">
    <h1>Track of the Day</h1>
    <button id="navToggle" class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">☰</button>
    <nav id="primary-nav" class="navlinks" aria-label="Primary">
      <a href="/kacky">Kacky Finishes</a>
      <a href="/recentwrs">Recent WRs</a>
      <a href="/highlights">Community Highlights</a>
    </nav>
    <div class="cta">
      <a href="/" class="btn">Home</a>
    </div>
  </div>

  <div class="container month-row">
    <div class="select">
      <span>Month:</span>
      <select id="month"></select>
    </div>
  </div>
</header>

<script>
(function(){
  const btn = document.getElementById('navToggle');
  const nav = document.getElementById('primary-nav');
  if (!btn || !nav) return;
  btn.addEventListener('click', () => {
    const open = nav.classList.toggle('show');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
})();
</script>

<main class="container">
  <section id="today" class="hero">
    <div class="thumb" id="t-thumb"></div>

    <div class="hero-panel">
      <h2 id="t-name">(loading…)</h2>

      <div class="hero-meta">
        <div class="hero-row">
          <span class="hero-label">Author:</span>
          <span class="badge" id="t-author">—</span>
        </div>

        <p id="t-date" class="date"></p>

        <div id="t-medals"></div>

        <div class="actions" id="t-actions"></div>
      </div>
    </div>
  </section>

  <section class="grid" id="grid"></section>
</main>

<script>
(function(){
  const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const bust=()=>`?t=${Date.now()}`;

  const jget = async (url)=>{
    const r = await fetch(url+bust(), { cache:"no-store" });
    if(!r.ok) throw new Error(`${url} -> ${r.status}`);
    return r.json();
  };

  const set=(id,html)=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=html;
  };

  const setText=(id,txt)=>{
    const el=document.getElementById(id);
    if(el) el.textContent=txt ?? "";
  };

  function fmtMs(ms){
    if(ms==null) return null;
    const t=Math.max(0,Number(ms)|0);
    const m=Math.floor(t/60000);
    const s=Math.floor((t%60000)/1000);
    const ms3=(t%1000).toString().padStart(3,"0");
    return `${m}:${s.toString().padStart(2,"0")}.${ms3}`;
  }

  function authorMedal(msVal){
    if (msVal == null || Number(msVal) <= 0) return "";
    return `
      <span class="medal author">
        <img class="medal-icon" src="/img/author.png" alt="Author Medal" loading="lazy">
        <b>AT</b>
        <span class="mono">${fmtMs(msVal)}</span>
      </span>
    `;
  }

  function buildMedals(map){
    if(!map) return "";
    const at = authorMedal(map.authorTime);
    return at ? `<div class="medals">${at}</div>` : "";
  }

  const button = (label, href, extra='') =>
    `<a class="btn" href="${href}" target="_blank" rel="noopener" ${extra}>${label}</a>`;

  function actionsFromMap(map){
    const acts=[];
    if(map?.downloadUrl) acts.push(button("⬇️ Download", map.downloadUrl));
    if(map?.uid) acts.push(`<button class="btn ghost" data-copy-uid="${map.uid}">Copy UID</button>`);
    return acts.join("");
  }

  function renderHero(rec){
    if(!rec) return;
    const m = rec.map || {};

    set("t-thumb",
      m.thumbnailUrl
        ? `<img src="${m.thumbnailUrl}" referrerpolicy="no-referrer" alt="Map thumbnail">`
        : `<div class="thumb" style="display:grid;place-items:center;color:var(--muted)">No image</div>`
    );

    setText("t-name", m.name || "(unknown map)");
    setText("t-author", m.authorDisplayName || "—");
    setText("t-date", rec.date || "");
    set("t-medals", buildMedals(m));
    set("t-actions", actionsFromMap(m));
  }

  function renderGrid(days){
    const grid=document.getElementById("grid");
    if(!grid) return;
    grid.innerHTML="";

    const keys=Object.keys(days).sort();
    for(const k of keys){
      const d=days[k];
      const m=d.map || {};

      const card=document.createElement("article");
      card.className="card";
      card.innerHTML=`
        <div class="thumb">
          ${m.thumbnailUrl ? `<img loading="lazy" referrerpolicy="no-referrer" src="${m.thumbnailUrl}" alt="">` : ""}
        </div>
        <div class="meta">
          <div class="date">${d.date}</div>
          <h3 class="card-title">${m.name || "(unknown map)"}</h3>

          <div class="byline">
            <span class="byline-label">Author:</span>
            <span class="badge">${m.authorDisplayName || "—"}</span>
          </div>

          ${buildMedals(m)}

          <div class="meta-footer">
            ${m.downloadUrl ? `<a class="btn" href="${m.downloadUrl}" target="_blank" rel="noopener">⬇️ Download</a>` : ""}
            ${m.uid ? `<button class="btn ghost" data-copy-uid="${m.uid}">Copy UID</button>` : ""}
          </div>
        </div>`;
      grid.appendChild(card);
    }
  }

  async function loadMonth(ym){
    const month = await jget(`data/totd/${ym}.json`);
    const latest = month.days[Object.keys(month.days).sort().pop()];
    renderHero(latest);
    renderGrid(month.days);
  }

  async function init(){
    const sel=document.getElementById("month");
    const monthsJ=await jget("/data/totd/months.json");
    const months=(monthsJ?.months||[]).slice().sort().reverse();

    if(!months.length){
      if(sel) sel.innerHTML=`<option>(no data yet)</option>`;
      return;
    }

    if(sel){
      sel.innerHTML=months.map(k=>{
        const [y,mm]=k.split("-");
        return `<option value="${k}">${MONTHS[+mm-1]} ${y}</option>`;
      }).join("");

      sel.value=months[0];
      sel.onchange=()=>loadMonth(sel.value);
    }

    await loadMonth(months[0]);
  }

  document.addEventListener("click",(e)=>{
    const t=e.target;
    if(t && t.matches("[data-copy-uid]")){
      const uid=t.getAttribute("data-copy-uid");
      if(uid){
        navigator.clipboard?.writeText(uid).then(()=>{
          t.textContent="Copied!";
          setTimeout(()=>t.textContent="Copy UID",1200);
        }).catch(()=>{
          t.textContent="Copy failed";
          setTimeout(()=>t.textContent="Copy UID",1200);
        });
      }
    }
  });

  init().catch(err=>{
    console.error("[TOTD] init failed:",err);
    const n=document.getElementById("t-name");
    if(n) n.textContent="(failed to load)";
  });
})();
</script>
</body>
</html>
