<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" type="image/png" href="/logo.png">
  <link rel="apple-touch-icon" href="/logo.png">
  <link rel="shortcut icon" href="/logo.png">
  <title>Track of the Day</title>

  <style>
:root{
--bg:#05070c;
--bg-2:#080b11;
--panel:rgba(255,255,255,.035);
--panel-2:rgba(255,255,255,.028);
--panel-3:rgba(255,255,255,.02);

--text:#f3f5f7;
--muted:#a7adb8;
--soft:#d7dbe2;

--border:rgba(255,255,255,.07);
--border-strong:rgba(255,255,255,.12);

--shadow-sm:0 10px 26px rgba(0,0,0,.22);
--shadow-md:0 18px 42px rgba(0,0,0,.30);

--radius:20px;
--radius-sm:12px;
}

*{
box-sizing:border-box;
}

html,
body{
height:100%;
}

body{
margin:0;
font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,"Helvetica Neue",Arial;
color:var(--text);
background:#05070c;
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
}

a{
color:inherit;
text-decoration:none;
}

.container{
width:min(1200px,92vw);
margin:auto;
padding:1rem;
}

body.bg-track-curves{
background:#05070c;
}

body.bg-track-curves::after{
content:"";
position:fixed;
inset:0;
pointer-events:none;
z-index:-1;
opacity:.014;
background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140' viewBox='0 0 140 140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
background-size:220px 220px;
}

header{
position:sticky;
top:0;
z-index:50;

background:rgba(5,7,12,.84);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

border-bottom:1px solid rgba(255,255,255,.05);
}

.nav{
display:grid;
grid-template-columns:auto 1fr auto;
align-items:center;
gap:1rem;
padding:1rem 0 .75rem;
}

h1{
margin:0;
font-size:2rem;
line-height:1;
font-weight:950;
letter-spacing:-.03em;
color:#f7faff;
}

.nav-center{
display:flex;
justify-content:center;
align-items:center;
}

.navlinks{
display:flex;
gap:1.5rem;
align-items:center;
}

.navlinks a{
color:var(--muted);
white-space:nowrap;
font-size:.95rem;
font-weight:800;
letter-spacing:.01em;
opacity:.92;
transition:.18s ease;
}

.navlinks a:hover{
color:#ffffff;
opacity:1;
}

.navlinks a.active{
color:#ffffff;
position:relative;
}

.navlinks a.active::after{
content:"";
position:absolute;
left:0;
right:0;
bottom:-8px;
height:2px;
border-radius:999px;
background:rgba(255,255,255,.24);
}

.cta{
display:flex;
justify-content:flex-end;
}

.nav-toggle{
display:none;

border:1px solid var(--border);

background:rgba(255,255,255,.045);

color:var(--text);

border-radius:12px;

padding:.5rem .7rem;

cursor:pointer;

font-weight:800;
}

.month-row{
display:flex;
align-items:center;
justify-content:flex-start;
gap:.7rem;

padding:.05rem 1rem 1rem;

color:var(--muted);

font-size:.94rem;
font-weight:800;
}

.select{
display:flex;
align-items:center;
gap:.6rem;
}

select{
background:rgba(255,255,255,.035);

border:1px solid var(--border);

color:var(--text);

padding:.62rem .84rem;

border-radius:12px;

font-weight:800;

outline:none;

min-width:146px;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}

select:focus{
border-color:var(--border-strong);
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:.45rem;

min-height:40px;

padding:.6rem .95rem;

border-radius:14px;

border:1px solid var(--border);

background:rgba(255,255,255,.045);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

color:var(--text);

font-weight:850;
font-size:.92rem;
line-height:1;

transition:.18s ease;

cursor:pointer;
}

.btn:hover{
transform:translateY(-2px);

border-color:var(--border-strong);

background:rgba(255,255,255,.065);

box-shadow:var(--shadow-sm);
}

.btn.ghost{
background:transparent;
}

.leaderboard-panel{
margin:1rem 0 1.5rem;
}

.leaderboard-row{
display:flex;
justify-content:space-between;
padding:.55rem .75rem;
border-bottom:1px solid var(--border);
}

.leaderboard-rank{
width:24px;
font-weight:900;
color:#ffffff;
opacity:.72;
}

.hero{
display:grid;
grid-template-columns:minmax(320px,480px) minmax(280px,1fr);
gap:1.15rem;
margin:1.15rem 0 1.35rem;
align-items:stretch;
}

.hero .thumb{
width:100%;
border-radius:var(--radius);
overflow:hidden;
border:1px solid var(--border);
background:#09111d;
}

.hero-panel{
display:flex;
flex-direction:column;
justify-content:flex-start;
gap:.95rem;
min-width:0;

border:1px solid var(--border);

border-radius:var(--radius);

background:rgba(255,255,255,.035);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

padding:1.2rem 1.2rem 1.15rem;
}

.hero h2{
margin:0;
font-size:clamp(1.7rem,2.9vw,2.35rem);
line-height:1.03;
letter-spacing:-.035em;
color:#f7faff;
}

.hero-meta{
display:flex;
flex-direction:column;
gap:.62rem;
}

.hero-row{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:.55rem;
}

.hero-label{
color:var(--muted);
font-weight:850;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:.65rem;
margin-top:.28rem;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
gap:1.15rem;
align-items:stretch;
}

.card{
display:flex;
flex-direction:column;
min-height:100%;
overflow:hidden;

border:1px solid var(--border);

border-radius:var(--radius);

background:rgba(255,255,255,.03);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

transition:.18s ease;
}

.card:hover{
transform:translateY(-4px);

border-color:var(--border-strong);

box-shadow:var(--shadow-md);
}

.thumb{
aspect-ratio:16/9;
background:#09111d;
overflow:hidden;
position:relative;
}

.thumb::after{
content:"";
position:absolute;
inset:0;
background:rgba(0,0,0,.34);
}

.thumb img{
width:100%;
height:100%;
object-fit:cover;
display:block;
opacity:.78;
}

.meta{
padding:1.02rem 1rem 1.05rem;

display:flex;
flex-direction:column;
flex:1;

gap:.56rem;

min-width:0;
}

.date{
font-size:.84rem;
color:var(--muted);
line-height:1.2;
font-weight:800;
letter-spacing:.01em;
}

.card-title{
margin:0;
font-size:1.12rem;
line-height:1.2;
font-weight:950;
letter-spacing:-.02em;
color:#f5f8ff;
word-break:break-word;
}

.byline{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:.45rem;
color:#dce7ff;
line-height:1.35;
}

.byline-label{
color:var(--soft);
font-weight:850;
}

.badge{
display:inline-flex;
align-items:center;
gap:.35rem;

max-width:100%;

min-height:30px;

border:1px solid var(--border);

padding:.28rem .62rem;

border-radius:999px;

font-size:.81rem;

background:rgba(255,255,255,.05);

color:#e2ecff;

overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;

font-weight:800;
}

.medals{
display:flex;
flex-wrap:wrap;
align-items:center;
gap:.45rem;
margin-top:.06rem;
}

.medal{
display:inline-flex;
align-items:center;
gap:.38rem;

min-height:28px;

padding:.24rem .5rem;

border-radius:999px;

border:1px solid var(--border);

background:rgba(255,255,255,.04);

font-size:.8rem;
line-height:1;

color:#edf3ff;

font-weight:800;
}

.medal .medal-icon{
width:15px;
height:15px;
object-fit:contain;
flex:0 0 auto;
}

.medal.author{
border-color:rgba(255,255,255,.12);
background:rgba(255,255,255,.06);
}

.mono{
font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
letter-spacing:.01em;
}

.meta-footer{
margin-top:auto;
padding-top:.38rem;
display:flex;
flex-wrap:wrap;
gap:.6rem;
}

.meta-footer .btn{
flex:0 0 auto;
}

.today-extra{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:.75rem;
margin-top:.2rem;
}

.stat-box{
border:1px solid var(--border);

background:rgba(255,255,255,.03);

backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);

border-radius:14px;

padding:.75rem;
}

.stat-box span{
display:block;
color:var(--muted);
font-size:.78rem;
font-weight:850;
margin-bottom:.25rem;
}

.stat-box strong{
font-size:1rem;
color:#fff;
}

.archive-tools{
display:flex;
gap:.7rem;
align-items:center;
justify-content:space-between;
margin:1rem 0 1.1rem;
flex-wrap:wrap;
}

.search{
flex:1;
min-width:240px;

background:rgba(255,255,255,.035);

border:1px solid var(--border);

color:var(--text);

padding:.72rem .9rem;

border-radius:14px;

font-weight:750;

outline:none;

backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
}

.search:focus{
border-color:var(--border-strong);
}

.section-title{
margin:1.1rem 0 .75rem;
font-size:1.25rem;
font-weight:950;
letter-spacing:-.02em;
}

.empty-state{
grid-column:1/-1;

color:var(--muted);

border:1px solid var(--border);

border-radius:var(--radius);

padding:1rem;

background:rgba(255,255,255,.03);
}

.btn.ghost[data-load-board]{
border-color:rgba(255,255,255,.12);
}

.btn.ghost[data-load-board]:hover{
background:rgba(255,255,255,.05);
border-color:rgba(255,255,255,.18);
}

.leaderboard-panel.active{
border:1px solid var(--border-strong);
border-radius:var(--radius);
}

*{
scrollbar-color:
rgba(255,255,255,.16)
transparent;
}

::-webkit-scrollbar{
width:8px;
height:8px;
}

::-webkit-scrollbar-track{
background:transparent;
}

::-webkit-scrollbar-thumb{
background:rgba(255,255,255,.16);
border-radius:999px;
}

::-webkit-scrollbar-thumb:hover{
background:rgba(255,255,255,.24);
}

@media (max-width:920px){

.nav{
grid-template-columns:auto auto 1fr auto;
}

.nav-center{
justify-content:flex-start;
}

.hero{
grid-template-columns:1fr;
}

}

@media (max-width:640px){

h1{
font-size:1.58rem;
}

.nav{
display:flex;
align-items:center;
justify-content:space-between;
}

.nav-center{
display:contents;
}

.nav-toggle{
display:block;
}

.navlinks{
display:none;

position:absolute;
top:64px;
left:0;
right:0;

padding:.9rem 1rem 1rem;

background:rgba(5,7,12,.96);

backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);

flex-direction:column;
align-items:flex-start;

gap:.82rem;

border-top:1px solid var(--border);
}

.navlinks.show{
display:flex;
}

.cta{
display:none;
}

.container{
width:min(100%,94vw);
}

.grid{
grid-template-columns:1fr;
}

.meta-footer .btn,
.actions .btn{
width:100%;
}

.today-extra{
grid-template-columns:1fr;
}

}
</style>
</head>

  <script>
    (function () {
      const btn = document.getElementById('navToggle');
      const nav = document.getElementById('primary-nav');
      if (!btn || !nav) return;

      function syncDesktop() {
        if (window.innerWidth > 640) {
          nav.classList.remove('show');

      }

      btn.addEventListener('click', () => {

      window.addEventListener('resize', syncDesktop);

  <main class="container">
    <section id="today" class="hero">
      <div class="thumb" id="t-thumb"></div>

      <div class="hero-panel">
        <div class="hero-row">
          <span class="badge">🏁 Today’s TOTD</span>
        </div>

        <h2 id="t-name">(loading…)</h2>

        <div class="hero-meta">
          <div class="hero-row">
            <span class="hero-label">Author:</span>
            <span class="badge" id="t-author">—</span>
          </div>

          <p id="t-date" class="date"></p>

          <div id="t-medals"></div>

          <div class="today-extra">
            <div class="stat-box">
              <span>Map UID</span>
              <strong id="t-uid">—</strong>
            </div>
            <div class="stat-box">
              <span>Author Time</span>
              <strong id="t-at">—</strong>
            </div>
            <div class="stat-box">
              <span>Status</span>
              <strong>Daily Track</strong>
            </div>
          </div>

          <div class="actions" id="t-actions"></div>
        </div>
    </section>

    <section class="leaderboard-panel">
      <h2 class="section-title">🏆 Today's Top 10</h2>
      <div id="totdLeaderboard" class="empty-state">
        Loading leaderboard...
      </div>
    </section>
    <div class="archive-tools">
      <h2 class="section-title">TOTD Archive</h2>
      <input id="mapSearch" class="search" type="search" placeholder="Search maps or authors...">
    </div>

    <section class="grid" id="grid"></section>
  </main>

  <script>
    (function () {
      const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const bust = () => `?t=${Date.now()}`;

      const jget = async (url) => {
        const r = await fetch(url + bust(), { cache: "no-store" });
        if (!r.ok) throw new Error(`${url} -> ${r.status}`);
        return r.json();
      };

      const set = (id, html) => {
        const el = document.getElementById(id);
        if (el) el.innerHTML = html;
      };

      const setText = (id, txt) => {
        const el = document.getElementById(id);
        if (el) el.textContent = txt ?? "";
      };

      function fmtMs(ms) {
        if (ms == null) return null;
        const t = Math.max(0, Number(ms) | 0);
        const m = Math.floor(t / 60000);
        const s = Math.floor((t % 60000) / 1000);
        const ms3 = (t % 1000).toString().padStart(3, "0");
        return `${m}:${s.toString().padStart(2, "0")}.${ms3}`;
      }

      function authorMedal(msVal) {
        if (msVal == null || Number(msVal) <= 0) return "";
        return `
      <span class="medal author">
        <img class="medal-icon" src="/img/author.png" alt="Author Medal" loading="lazy">
        <b>AT</b>
        <span class="mono">${fmtMs(msVal)}</span>
      </span>
    `;
      }

      function buildMedals(map) {
        if (!map) return "";

        if (map.authorTime == null || Number(map.authorTime) <= 0) {
          return `
      <div class="medals">
        <span class="medal">
          <b>AT</b>
          <span class="mono">Unavailable</span>
        </span>
      </div>
    `;
        }

        return `
    <div class="medals">
      ${authorMedal(map.authorTime)}
    </div>
  `;
      }

      const button = (label, href, extra = '') =>
        `<a class="btn" href="${href}" target="_blank" rel="noopener" ${extra}>${label}</a>`;

      function actionsFromMap(map) {
        const acts = [];
        if (map?.downloadUrl) acts.push(button("⬇️ Download", map.downloadUrl));
        if (map?.uid) acts.push(`<button class="btn ghost" data-copy-uid="${map.uid}">Copy UID</button>`);
        return acts.join("");
      }

      function renderHero(rec) {
        if (!rec) return;
        const m = rec.map || {};

        set("t-thumb",
          m.thumbnailUrl
            ? `<img src="${m.thumbnailUrl}" referrerpolicy="no-referrer" alt="Map thumbnail">`
            : `<div class="thumb" style="display:grid;place-items:center;color:var(--muted)">No image</div>`
        );

        setText("t-name", m.name || "(unknown map)");
        setText("t-author", m.authorDisplayName || "—");
        setText("t-date", rec.date ? `Released ${rec.date}` : "");
        set("t-medals", buildMedals(m));
        set("t-actions", actionsFromMap(m));

        setText("t-uid", m.uid ? `${m.uid.slice(0, 8)}…` : "—");
        setText("t-at", m.authorTime ? fmtMs(m.authorTime) : "—");
        loadTotdLeaderboard(m.uid);
      }

      function renderGrid(days) {
        const grid = document.getElementById("grid");
        if (!grid) return;

        currentDays = days || {};

        const search = document.getElementById("mapSearch");
        const q = (search?.value || "").toLowerCase();

        grid.innerHTML = "";

        const keys = Object.keys(currentDays).sort().reverse();

        let count = 0;

        for (const k of keys) {
          const d = currentDays[k];
          const m = d.map || {};

          const hay = `${m.name || ""} ${m.authorDisplayName || ""}`.toLowerCase();
          if (q && !hay.includes(q)) continue;

          count++;

          const card = document.createElement("article");
          card.className = "card";
          card.innerHTML = `
      <div class="thumb">
        ${m.thumbnailUrl ? `<img src="${m.thumbnailUrl}" loading="lazy">` : ""}
      </div>
      <div class="meta">
        <div class="date">${d.date}</div>
        <h3 class="card-title">${m.name || "(unknown)"}</h3>

        <div class="byline">
          <span class="byline-label">Author:</span>
          <span class="badge">${m.authorDisplayName || "—"}</span>
        </div>

        ${buildMedals(m)}

        <div class="meta-footer">
          ${m.downloadUrl ? `<a class="btn" href="${m.downloadUrl}" target="_blank">⬇️ Download</a>` : ""}
          ${m.uid ? `<button class="btn ghost" data-load-board="${m.uid}" data-map-name="${(m.name || "Map").replace(/"/g, "&quot;")}">View Top 10</button>` : ""}
          ${m.uid ? `<button class="btn ghost" data-copy-uid="${m.uid}">Copy UID</button>` : ""}
        </div>
      </div>
    `;
          grid.appendChild(card);
        }

        if (count === 0) {
          grid.innerHTML = `<div class="empty-state">No maps found.</div>`;
        }
      }

      async function loadMonth(ym) {
        const month = await jget(`/data/totd/${ym}.json`);

        console.log("[TOTD month loaded]", ym, month);
        console.log("[TOTD days count]", Object.keys(month.days || {}).length);

        const days = month.days || {};
        const keys = Object.keys(days).sort();

        if (!keys.length) {
          renderHero(null);
          renderGrid({});
          return;
        }

        const latest = days[keys[keys.length - 1]];

        renderHero(latest);
        renderGrid(days);
      }
      async function loadTotdLeaderboard(mapUid) {
        const el = document.getElementById("totdLeaderboard");
        if (!el || !mapUid) return;

        el.innerHTML = "Loading leaderboard...";

        try {
          const res = await fetch(`/data/totd-leaderboards/${mapUid}.json?t=${Date.now()}`);
          if (!res.ok) throw new Error("Missing leaderboard JSON");

          const data = await res.json();
          const rows = data.rows || [];

          if (!rows.length) {
            el.innerHTML = "No leaderboard data yet.";
            return;
          }

          el.innerHTML = rows.slice(0, 10).map((r, i) => `
      <div class="leaderboard-row">
        <span class="leaderboard-rank">#${i + 1}</span>
        <span>${r.player || "Unknown"}</span>
        <strong class="mono">${fmtMs(r.timeMs)}</strong>
      </div>
    `).join("");
        } catch (err) {
          el.innerHTML = "Leaderboard coming soon.";
        }
      }
      async function init() {
        const sel = document.getElementById("month");
        const monthsJ = await jget("/data/totd/months.json");
        const months = (monthsJ?.months || []).slice().sort().reverse();

        if (!months.length) {
          if (sel) sel.innerHTML = `<option>(no data yet)</option>`;
          return;
        }

        if (sel) {
          sel.innerHTML = months.map(k => {
            const [y, mm] = k.split("-");
            return `<option value="${k}">${MONTHS[+mm - 1]} ${y}</option>`;
          }).join("");

          sel.value = months[0];
          sel.onchange = () => loadMonth(sel.value);
        }

        await loadMonth(months[0]);
        const search = document.getElementById("mapSearch");
        if (search) {
          search.addEventListener("input", () => {
            renderGrid(currentDays);
          });
        }
      }

      document.addEventListener("click", (e) => {
        const t = e.target;
        if (t && t.matches("[data-load-board]")) {
          const uid = t.getAttribute("data-load-board");
          const name = t.getAttribute("data-map-name") || "Selected map";

          const title = document.querySelector(".leaderboard-panel .section-title");
          if (title) title.textContent = `🏆 Top 10 — ${name}`;

          loadTotdLeaderboard(uid);

          document.querySelector(".leaderboard-panel")?.scrollIntoView({
            behavior: "smooth",
            block: "start"
          });

          return;
        }
        if (t && t.matches("[data-copy-uid]")) {
          const uid = t.getAttribute("data-copy-uid");
          if (uid) {
            navigator.clipboard?.writeText(uid).then(() => {
              t.textContent = "Copied!";
              setTimeout(() => t.textContent = "Copy UID", 1200);
            }).catch(() => {
              t.textContent = "Copy failed";
              setTimeout(() => t.textContent = "Copy UID", 1200);
            });
          }
        }
      });

      init().catch(err => {
        console.error("[TOTD] init failed:", err);
        const n = document.getElementById("t-name");
        if (n) n.textContent = "(failed to load)";
      });
    })();
  </script>
</body>

</html>
